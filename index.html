<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5f8">
<meta name="description" content="Proova : réservez le nettoyage de votre voiture ou de votre maison au prix affiché. Prestataires vérifiés, paiement après la prestation.">
<title>Proova | Nettoyage voiture et maison au prix affiché</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 24'%3E%3Ccircle cx='12' cy='12' r='9' fill='%230f2741'/%3E%3Ccircle cx='26' cy='12' r='9' fill='%23ffc933'/%3E%3C/svg%3E">
<style>
/* ============================================================ Proova — styles */
:root {
  --ink: #0f2741;
  --ink-2: #34506e;
  --muted: #5f7389;
  --paper: #f2f5f8;
  --surface: #ffffff;
  --mist: #e7edf3;
  --line: #d4dee7;
  --glove: #e03131;
  --glove-2: #b42323;
  --glove-soft: #fdecec;
  --star: #f2b705;
  --lake: #2e64a8;
  --ok: #137a50;   --ok-soft: #e1f3ea;
  --wait: #8a5800; --wait-soft: #fff0d3;
  --info: #2257a0; --info-soft: #e2ecf9;
  --live: #0b7480; --live-soft: #daf1f2;
  --bad: #b5382a;  --bad-soft: #fbe5e1;
  --off: #66727f;  --off-soft: #eceff2;
  --r-sm: 10px; --r: 14px; --r-lg: 20px;
  --font: 'Schibsted Grotesk', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --shadow-ticket: drop-shadow(0 1px 1px rgba(15, 39, 65, .07)) drop-shadow(0 12px 22px rgba(15, 39, 65, .09));
  --tabbar-h: 0px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 80px; }
body {
  margin: 0; font-family: var(--font); font-size: 16px; line-height: 1.5; color: var(--ink); background: var(--paper);
  -webkit-font-smoothing: antialiased; font-feature-settings: 'ss01';
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
body.no-scroll { overflow: hidden; }
h1, h2, h3 { margin: 0; line-height: 1.15; letter-spacing: -0.015em; }
p { margin: 0; }
a { color: inherit; }
img, svg { display: block; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lake); outline-offset: 2px; border-radius: 6px; }
[tabindex="-1"]:focus { outline: none; }
.sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.ok { color: var(--ok); } .warn { color: var(--wait); }
.ic { width: 20px; height: 20px; flex: none; }
.ic-xl { width: 40px; height: 40px; stroke-width: 1.5; }
.price { font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }

/* ---------------------------------------------------------------- logo */
.logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 23px; letter-spacing: -0.045em; color: var(--ink); }
.logo svg { width: 34px; height: 21px; }
.logo-lg { font-size: 40px; } .logo-lg svg { width: 56px; height: 34px; }
.logo-link { text-decoration: none; display: inline-flex; border-radius: 8px; }

/* ---------------------------------------------------------------- boutons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px;
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink);
  font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: background-color .15s, border-color .15s, transform .1s;
}
.btn:hover { border-color: var(--ink-2); }
.btn:active { transform: translateY(1px); }
.btn .ic { width: 18px; height: 18px; }
.btn-primary { background: var(--glove); border-color: var(--glove); color: #fff; }
.btn-primary:hover { background: var(--glove-2); border-color: var(--glove-2); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ghost:hover { background: var(--mist); border-color: var(--mist); }
.btn-danger { color: var(--bad); }
.btn-danger-solid { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn-danger-solid:hover { background: #962c20; border-color: #962c20; }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn-lg { min-height: 52px; padding: 12px 22px; font-size: 16px; }
.btn-block { width: 100%; }
.btn[disabled], .btn.is-busy { opacity: .6; cursor: progress; }
.link { background: none; border: 0; padding: 0; color: var(--info); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.icon-btn {
  display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 12px; border: 0; background: transparent;
  color: var(--ink-2); cursor: pointer; flex: none; text-decoration: none;
}
.icon-btn:hover { background: var(--mist); }
.icon-btn-solid { background: var(--ink); color: #fff; }
.icon-btn-solid:hover { background: var(--ink-2); }

/* ---------------------------------------------------------------- pastilles & puces */
.pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 13px; font-weight: 600;
  white-space: nowrap; line-height: 1.4;
}
.pill .ic { width: 14px; height: 14px; }
.pill-wait { background: var(--wait-soft); color: var(--wait); }
.pill-info { background: var(--info-soft); color: var(--info); }
.pill-live { background: var(--live-soft); color: var(--live); }
.pill-ok { background: var(--ok-soft); color: var(--ok); }
.pill-off { background: var(--off-soft); color: var(--off); }
.pill-rate { background: var(--glove-soft); color: var(--glove-2); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips-scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips-scroll::-webkit-scrollbar { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 6px 14px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap;
}
.chip .ic { width: 16px; height: 16px; }
.chip:hover { border-color: var(--ink-2); }
.chip.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }
.chip-n { font-variant-numeric: tabular-nums; opacity: .65; font-weight: 500; }

/* ---------------------------------------------------------------- ticket (motif central) */
.ticket { filter: var(--shadow-ticket); display: flex; flex-direction: column; }
.ticket-body, .ticket-stub { --r: 12px; background: var(--surface); }
.ticket-body {
  border-radius: var(--r-lg) var(--r-lg) 0 0; padding: 22px;
  -webkit-mask: radial-gradient(circle var(--r) at 0 100%, #0000 calc(var(--r) - .5px), #000 var(--r)) left / 51% 100% no-repeat,
    radial-gradient(circle var(--r) at 100% 100%, #0000 calc(var(--r) - .5px), #000 var(--r)) right / 51% 100% no-repeat;
  mask: radial-gradient(circle var(--r) at 0 100%, #0000 calc(var(--r) - .5px), #000 var(--r)) left / 51% 100% no-repeat,
    radial-gradient(circle var(--r) at 100% 100%, #0000 calc(var(--r) - .5px), #000 var(--r)) right / 51% 100% no-repeat;
}
.ticket-perf { display: none; }
.ticket-stub {
  border-radius: 0 0 var(--r-lg) var(--r-lg); padding: 20px 22px 22px; background-color: var(--glove); color: #fff;
  position: relative;
  -webkit-mask: radial-gradient(circle var(--r) at 0 0, #0000 calc(var(--r) - .5px), #000 var(--r)) left / 51% 100% no-repeat,
    radial-gradient(circle var(--r) at 100% 0, #0000 calc(var(--r) - .5px), #000 var(--r)) right / 51% 100% no-repeat;
  mask: radial-gradient(circle var(--r) at 0 0, #0000 calc(var(--r) - .5px), #000 var(--r)) left / 51% 100% no-repeat,
    radial-gradient(circle var(--r) at 100% 0, #0000 calc(var(--r) - .5px), #000 var(--r)) right / 51% 100% no-repeat;
  display: flex; flex-direction: column; gap: 2px;
}
.ticket-stub::before {
  content: ''; position: absolute; top: 0; left: 18px; right: 18px; height: 0; border-top: 2px dashed rgba(255, 255, 255, .5);
}
.ticket-stub .stub-label, .ticket-stub .stub-sub { color: rgba(255, 255, 255, .9); }
.ticket-stub .price { font-size: 40px; font-weight: 800; line-height: 1.05; }
.ticket-stub .btn-primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.ticket-stub .btn-primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.stub-label { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.stub-sub { font-size: 14px; color: var(--ink-2); }
.ticket-dark .ticket-body { background: #193a5e; color: #fff; }
.ticket-dark .stub-label { color: inherit; opacity: .8; }

/* ---------------------------------------------------------------- site public */
.demo-bar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px 12px; padding: 7px 16px;
  background: var(--ink); color: #dfe8f1; font-size: 13px; text-align: center;
}
.demo-bar .link { color: #ff9b9b; font-size: 13px; }
.site-top {
  display: flex; align-items: center; gap: 24px; max-width: 1200px; margin: 0 auto; padding: 18px 24px;
}
.site-nav { display: flex; gap: 22px; margin-left: 12px; }
.site-nav a { text-decoration: none; font-weight: 600; font-size: 15px; color: var(--ink-2); }
.site-nav a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; }
.site-cta { margin-left: auto; display: flex; gap: 8px; }
.site-top-plain { justify-content: space-between; }
.hero {
  max-width: 1200px; margin: 0 auto; padding: 40px 24px 72px;
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 56px; align-items: center;
}
.hero h1 { font-size: clamp(40px, 6.2vw, 72px); font-weight: 800; letter-spacing: -0.045em; line-height: .98; max-width: 11ch; }
.lead { margin-top: 22px; font-size: 19px; line-height: 1.55; color: var(--ink-2); max-width: 44ch; }
.hero-points { list-style: none; margin: 28px 0 0; padding: 0; display: grid; gap: 12px; }
.hero-points li { display: flex; gap: 10px; align-items: flex-start; font-weight: 500; }
.hero-points .ic { color: var(--ok); margin-top: 2px; }

.quote .ticket-body { display: grid; gap: 18px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; background: var(--mist); border-radius: 14px; }
.seg-item {
  display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 4px; border: 0; border-radius: 10px;
  background: transparent; color: var(--ink-2); font-size: 13px; font-weight: 600; cursor: pointer;
}
.seg-item .ic { width: 22px; height: 22px; }
.seg-item.is-on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(15, 39, 65, .12); }
.q-row { display: grid; gap: 8px; }
.q-label { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: var(--ink-2); }
.q-label output { color: var(--ink); font-variant-numeric: tabular-nums; }
.q-desc { font-size: 14px; color: var(--muted); }
.quote .ticket-stub { flex-direction: row; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; }
.stub-price { display: flex; flex-direction: column; gap: 2px; }
.was { color: var(--muted); font-weight: 600; text-decoration-thickness: 2px; font-variant-numeric: tabular-nums; }
.ticket-stub .was { color: rgba(255, 255, 255, .8); }
.was-line { font-size: 16px; line-height: 1.2; }
.was-line:empty { display: none; }
.promo-pill { display: inline-flex; align-items: center; gap: 6px; margin: 0 0 14px; padding: 6px 14px; border-radius: 999px;
  background: var(--glove); color: #fff; font-weight: 700; font-size: 14px; }
.promo-pill .ic { width: 16px; height: 16px; }

input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 32px; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 6px; border-radius: 99px; background: var(--mist); }
input[type=range]::-moz-range-track { height: 6px; border-radius: 99px; background: var(--mist); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 26px; height: 26px; margin-top: -10px; border-radius: 50%; background: var(--ink);
  border: 4px solid var(--glove); box-shadow: 0 1px 3px rgba(15, 39, 65, .3);
}
input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--ink); border: 4px solid var(--glove); }

.band { max-width: 1200px; margin: 0 auto; padding: 64px 24px; }
.band > h2 { font-size: clamp(28px, 3.6vw, 40px); font-weight: 800; letter-spacing: -0.035em; max-width: 22ch; }
.step-list { list-style: none; margin: 32px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.step-list li { display: flex; gap: 16px; border-top: 2px solid var(--ink); padding-top: 18px; }
.step-n { font-size: 36px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; color: var(--ink); min-width: 28px; }
.step-list h3 { font-size: 19px; margin-bottom: 6px; }
.step-list p { color: var(--ink-2); }
.svc-list { margin-top: 28px; border-top: 1.5px solid var(--line); }
.svc { display: grid; grid-template-columns: auto 1fr auto auto; gap: 20px; align-items: center; padding: 18px 0; border-bottom: 1.5px solid var(--line); }
.svc-ic { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: var(--mist); color: var(--ink); flex: none; }
.svc-ic .ic { width: 24px; height: 24px; }
.svc-ic-lg { width: 56px; height: 56px; }
.svc-txt h3 { font-size: 19px; }
.svc-txt p { color: var(--muted); font-size: 15px; }
.svc-price { text-align: right; line-height: 1.1; }
.svc-price small { display: block; color: var(--muted); font-size: 13px; }
.svc-price strong { font-size: 20px; font-variant-numeric: tabular-nums; }
.lease {
  display: flex; gap: 32px; align-items: center; justify-content: space-between; background: var(--glove-soft);
  border-radius: var(--r-lg); padding: 40px; margin-top: 16px; margin-bottom: 16px; max-width: 1152px;
}
.lease h2 { font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -0.03em; }
.lease p { margin-top: 10px; color: var(--ink-2); max-width: 62ch; }
.pros {
  display: grid; grid-template-columns: 1.2fr 1fr; gap: 48px; align-items: center; background: var(--ink); color: #fff;
  border-radius: 28px; padding: 56px; max-width: 1152px; margin-top: 48px;
}
.pros h2 { font-size: clamp(28px, 3.4vw, 40px); font-weight: 800; letter-spacing: -0.035em; max-width: 18ch; }
.pros-list { list-style: none; padding: 0; margin: 24px 0 28px; display: grid; gap: 14px; color: #dbe5ef; }
.pros-list li { display: flex; gap: 12px; }
.pros-list .ic { color: var(--glove); }
.pros-example { --shadow-ticket: none; }
.pe-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, .14); font-variant-numeric: tabular-nums; }
.pe-row:last-child { border-bottom: 0; }
.pros-example .ticket-body .stub-label { display: block; margin-bottom: 6px; }
.faq > * { max-width: 820px; }
.faq h2 { margin-bottom: 20px; }
.faq details { border-bottom: 1.5px solid var(--line); }
.faq summary {
  cursor: pointer; list-style: none; padding: 18px 36px 18px 0; font-weight: 700; font-size: 17px; position: relative;
}
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: '+'; position: absolute; right: 4px; top: 12px; font-size: 26px; font-weight: 400; color: var(--muted); }
.faq details[open] summary::after { content: '\2212'; }
.faq details p { padding: 0 0 18px; color: var(--ink-2); max-width: 64ch; }
.site-foot { max-width: 1200px; margin: 0 auto; padding: 40px 24px 56px; display: grid; gap: 8px; color: var(--ink-2); font-size: 15px; }

/* ---------------------------------------------------------------- authentification */
.auth { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.auth-top { padding: 18px 24px; }
.auth-main { flex: 1; display: flex; justify-content: center; padding: 16px 16px 48px; }
.auth-card { width: 100%; max-width: 440px; background: var(--surface); border-radius: var(--r-lg); padding: 32px; box-shadow: 0 1px 2px rgba(15, 39, 65, .06), 0 18px 40px -24px rgba(15, 39, 65, .3); align-self: flex-start; }
.auth-wide { max-width: 560px; }
.auth-card h1 { font-size: 30px; font-weight: 800; letter-spacing: -0.035em; margin-bottom: 8px; }
.auth-card > .muted { margin-bottom: 4px; }
.auth-links { margin-top: 14px; font-size: 15px; }
.auth-links a, .auth-switch a { color: var(--info); font-weight: 600; text-underline-offset: 3px; }
.auth-switch { margin-top: 10px; font-size: 15px; color: var(--muted); }
.demo-logins { margin-top: 24px; padding-top: 20px; border-top: 1.5px dashed var(--line); }
.demo-logins p { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-bottom: 10px; }
.demo-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.done-state { display: grid; gap: 14px; justify-items: start; }
.done-state .ic-xl { color: var(--lake); }

/* ---------------------------------------------------------------- formulaires */
.form { display: grid; gap: 16px; margin-top: 18px; }
.panel.form { margin-top: 0; }
.field { display: grid; gap: 6px; border: 0; padding: 0; margin: 0; min-width: 0; }
.field > span, .field > legend { font-size: 14px; font-weight: 600; color: var(--ink-2); padding: 0; }
.field em { font-style: normal; font-weight: 400; color: var(--muted); }
.field small { color: var(--muted); font-size: 13px; }
:where(input:not([type=range]):not([type=checkbox]):not([type=radio])), select, textarea {
  width: 100%; min-height: 48px; padding: 11px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface);
  font-size: 16px; transition: border-color .15s;
}
textarea { resize: vertical; min-height: 88px; line-height: 1.45; }
input:hover, select:hover, textarea:hover { border-color: #b4c3d1; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(46, 100, 168, .22); }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 20px) 21px, calc(100% - 15px) 21px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.input-unit { position: relative; display: block; }
.input-unit em { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-style: normal; color: var(--muted); font-size: 14px; pointer-events: none; }
.input-unit input { padding-right: 64px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-npa { grid-template-columns: 120px 1fr; }
.form-error { color: var(--bad); background: var(--bad-soft); padding: 10px 14px; border-radius: 10px; font-size: 15px; font-weight: 500; }
.note { background: var(--glove-soft); color: var(--ink); padding: 12px 14px; border-radius: 12px; font-size: 15px; margin-top: 12px; }
.check-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check-tile {
  display: flex; align-items: center; gap: 10px; padding: 12px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer;
  font-size: 15px; font-weight: 600; background: var(--surface);
}
.check-tile input { width: 18px; height: 18px; accent-color: var(--ink); margin: 0; flex: none; }
.check-tile:has(input:checked) { border-color: var(--ink); background: var(--mist); }
.toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 600; font-size: 15px; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle-ui { width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; transition: background .15s; flex: none; }
.toggle-ui::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); transition: transform .15s; }
.toggle input:checked + .toggle-ui { background: var(--ok); }
.toggle input:checked + .toggle-ui::after { transform: translateX(18px); }
.toggle input:focus-visible + .toggle-ui { outline: 3px solid var(--lake); outline-offset: 2px; }

/* ---------------------------------------------------------------- coque applicative */
.shell { --tabbar-h: 0px; min-height: 100vh; display: grid; grid-template-columns: 252px minmax(0, 1fr); align-items: start; }
.rail {
  position: sticky; top: 0; height: 100vh; height: 100dvh; padding: 22px 16px; display: flex; flex-direction: column; gap: 28px;
  background: var(--surface); border-right: 1.5px solid var(--mist); grid-row: 1 / span 2;
}
.rail .logo-link { padding: 0 10px; }
.rail-nav { display: grid; gap: 2px; }
.rail-item {
  display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 12px; text-decoration: none;
  font-weight: 600; color: var(--ink-2);
}
.rail-item:hover { background: var(--paper); color: var(--ink); }
.rail-item.is-active { background: var(--ink); color: #fff; }
.rail-user { margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; background: var(--paper); }
.rail-user-txt { display: grid; min-width: 0; flex: 1; line-height: 1.25; }
.rail-user-txt strong { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-user-txt small { color: var(--muted); font-size: 13px; }
.topbar, .tabbar { display: none; }
.main { padding: 36px 40px 64px; max-width: 1180px; width: 100%; min-width: 0; }
.main-plain { margin: 0 auto; padding: 8px 24px 64px; max-width: 1180px; }
.avatar {
  display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 50%; background: var(--glove);
  color: #fff; font-weight: 700; font-size: 14px; flex: none; text-decoration: none; letter-spacing: 0;
}
.avatar-lg { width: 52px; height: 52px; font-size: 18px; }

.page-head { margin-bottom: 24px; display: grid; gap: 4px; }
.page-head h1 { font-size: clamp(28px, 3.4vw, 38px); font-weight: 800; letter-spacing: -0.035em; }
.page-head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.section-title { font-size: 18px; font-weight: 700; margin: 28px 0 12px; }
.panel { background: var(--surface); border-radius: var(--r-lg); padding: 22px; box-shadow: 0 1px 2px rgba(15, 39, 65, .05); }
.panel + .panel, .cols + .panel, .mgrid + .panel, .stats + .panel, .mhead + .panel { margin-top: 16px; }
.panel-title { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 700; margin-bottom: 14px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.panel-head .panel-title { margin: 0; }
.panel-accent { background: var(--glove-soft); }
.panel-accent p { margin-bottom: 14px; }
.count { min-width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 99px; background: var(--mist); font-weight: 700; font-size: 14px; padding: 0 8px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; }
.cols > .panel + .panel { margin-top: 0; }
.cols-wide { grid-template-columns: 1.3fr 1fr; align-items: start; margin-top: 0; }
.stack { display: grid; gap: 16px; align-content: start; }
.stack > .panel + .panel { margin-top: 0; }
.empty { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 56px 24px; background: var(--surface); border-radius: var(--r-lg); }
.empty .ic-xl { color: var(--lake); }
.empty h2 { font-size: 22px; }
.empty p { color: var(--muted); max-width: 46ch; }
.empty-inline { padding: 24px; }
.back { display: inline-flex; align-items: center; gap: 4px; margin: 0 0 14px -6px; padding: 6px; text-decoration: none; font-weight: 600; color: var(--ink-2); border-radius: 8px; }
.back:hover { color: var(--ink); }
.banner { display: flex; gap: 12px; align-items: flex-start; padding: 14px 18px; border-radius: var(--r); margin-top: 16px; }
.banner-off { background: var(--off-soft); color: var(--ink); }
.banner .ic { margin-top: 2px; color: var(--off); }

/* ---------------------------------------------------------------- réservation */
.stepper { list-style: none; padding: 0; margin: 10px 0 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; counter-reset: st; }
.stepper li { counter-increment: st; font-size: 13px; font-weight: 600; color: var(--muted); border-top: 4px solid var(--line); padding-top: 8px; min-width: 0; }
.stepper li span::before { content: counter(st) '. '; }
.stepper li.is-done { border-color: var(--ink); color: var(--ink-2); }
.stepper li.is-on { border-color: var(--glove-2); color: var(--ink); }
.stepper button { all: unset; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.stepper button:focus-visible { outline: 3px solid var(--lake); }
.book-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 28px; align-items: start; }
.book-step { background: var(--surface); border-radius: var(--r-lg); padding: 26px; box-shadow: 0 1px 2px rgba(15, 39, 65, .05); }
.step-title { font-size: 19px; font-weight: 700; margin: 0 0 14px; }
.step-title:not(:first-child) { margin-top: 28px; }
.book-summary { position: sticky; top: 24px; }
.sum-head { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; }
.sum-head > div { display: grid; line-height: 1.25; }
.sum-head small { color: var(--muted); }
.sum-list { margin: 0; display: grid; gap: 10px; }
.sum-list div { display: grid; grid-template-columns: 76px 1fr; gap: 8px; font-size: 15px; }
.sum-list dt { color: var(--muted); }
.sum-list dd { margin: 0; font-weight: 500; }
.book-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 28px; padding-top: 18px; border-top: 1.5px solid var(--mist); }
.book-foot-price { display: none; }
.tile-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tile-grid-4 { grid-template-columns: repeat(4, 1fr); }
.tile {
  display: grid; gap: 6px; justify-items: start; text-align: left; padding: 16px; border-radius: var(--r); border: 1.5px solid var(--line);
  background: var(--surface); cursor: pointer;
}
.tile .ic { width: 26px; height: 26px; }
.tile small { color: var(--muted); font-size: 14px; }
.tile:hover { border-color: var(--ink-2); }
.tile.is-on { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); background: var(--paper); }
.tile-sm { justify-items: center; text-align: center; padding: 14px 8px; }
.radio-list { display: grid; gap: 8px; }
.radio-row {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 14px 16px; text-align: left;
  border-radius: var(--r); border: 1.5px solid var(--line); background: var(--surface); cursor: pointer;
}
.radio-row:hover { border-color: var(--ink-2); }
.radio-row.is-on { border-color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.radio-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line); }
.radio-row.is-on .radio-dot { border: 6px solid var(--ink); }
.radio-txt { display: grid; }
.radio-txt small { color: var(--muted); font-size: 14px; }
.radio-price { font-weight: 700; font-variant-numeric: tabular-nums; }
.surface { display: grid; grid-template-columns: 1fr 130px; gap: 16px; align-items: center; }
.surface-num { position: relative; }
.surface-num span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.surface-num input { padding-right: 44px; font-weight: 700; font-variant-numeric: tabular-nums; }
.opt-list { display: grid; gap: 8px; }
.opt-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 13px 16px; border: 1.5px solid var(--line); border-radius: var(--r); cursor: pointer; }
.opt-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt-box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.opt-box .ic { width: 15px; height: 15px; stroke-width: 3; }
.opt-row.is-on { border-color: var(--ink); }
.opt-row.is-on .opt-box { background: var(--ink); border-color: var(--ink); color: var(--glove); }
.opt-row:has(input:focus-visible) { outline: 3px solid var(--lake); outline-offset: 2px; }
.opt-name { font-weight: 600; }
.opt-price { color: var(--ink-2); font-variant-numeric: tabular-nums; font-weight: 600; }
.day-strip { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.day {
  flex: none; width: 68px; display: grid; justify-items: center; gap: 0; padding: 10px 4px; border-radius: var(--r);
  border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; scroll-snap-align: start; line-height: 1.2;
}
.day strong { font-size: 22px; font-variant-numeric: tabular-nums; }
.day small { font-size: 13px; color: var(--muted); }
.day.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }
.day.is-on small { color: #c9d6e3; }
.slot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.slot {
  display: grid; justify-items: center; min-height: 48px; padding: 8px 6px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface);
  font-weight: 700; font-variant-numeric: tabular-nums; cursor: pointer; line-height: 1.2;
}
.slot small { font-size: 12px; font-weight: 600; color: var(--wait); }
.slot:hover:not([disabled]) { border-color: var(--ink-2); }
.slot.is-on { background: var(--ink); border-color: var(--ink); color: #fff; }
.slot.is-on small { color: var(--glove); }
.slot[disabled] { opacity: .35; cursor: not-allowed; text-decoration: line-through; }
.recap { margin: 0; display: grid; border-top: 1.5px solid var(--mist); }
.recap div { display: grid; grid-template-columns: 140px 1fr; gap: 12px; padding: 12px 0; border-bottom: 1.5px solid var(--mist); }
.recap dt { color: var(--muted); }
.recap dd { margin: 0; font-weight: 600; }
.reassure { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 10px; }
.reassure li { display: flex; gap: 10px; color: var(--ink-2); }
.reassure .ic { color: var(--ok); }

/* ---------------------------------------------------------------- listes de missions */
.mlist { display: grid; gap: 10px; }
.mrow {
  display: grid; grid-template-columns: 64px 1fr auto; gap: 16px; align-items: center; padding: 14px 18px 14px 0; text-decoration: none;
  background: var(--surface); border-radius: var(--r); box-shadow: 0 1px 2px rgba(15, 39, 65, .05); transition: box-shadow .15s;
}
.mrow:hover { box-shadow: 0 1px 2px rgba(15, 39, 65, .06), 0 8px 20px -10px rgba(15, 39, 65, .25); }
.mrow.is-off { opacity: .7; }
.mrow-date { display: grid; justify-items: center; line-height: 1.1; border-right: 1.5px dashed var(--line); padding: 2px 0; }
.mrow-date strong { font-size: 24px; font-variant-numeric: tabular-nums; }
.mrow-date small { font-size: 12px; color: var(--muted); text-transform: lowercase; }
.mrow-main { display: grid; gap: 2px; min-width: 0; }
.mrow-main strong { font-size: 16px; }
.mrow-main small { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow-meta { display: flex !important; align-items: center; gap: 4px; }
.mrow-meta .ic { width: 15px; height: 15px; margin-left: 8px; }
.mrow-meta .ic:first-child { margin-left: 0; }
.mrow-side { display: grid; justify-items: end; gap: 6px; }
.mrow-side strong { font-variant-numeric: tabular-nums; font-size: 17px; }

/* ---------------------------------------------------------------- détail mission */
.mhead .ticket-body { padding: 24px; }
.mhead-top { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.mhead-title { flex: 1; min-width: 200px; }
.mhead-title h1 { font-size: clamp(24px, 3vw, 32px); font-weight: 800; letter-spacing: -0.03em; }
.mhead-title p { color: var(--muted); }
.mhead-stub { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.mhead-stub .price { font-size: 32px; }
.mref { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.timeline { list-style: none; margin: 24px 0 0; padding: 0; display: grid; grid-template-columns: repeat(5, 1fr); }
.timeline li { position: relative; display: grid; gap: 8px; padding-right: 8px; }
.timeline li::before { content: ''; position: absolute; top: 13px; left: 28px; right: 0; height: 2px; background: var(--line); }
.timeline li:last-child::before { display: none; }
.timeline li.is-done::before { background: var(--ink); }
.tl-dot { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.tl-dot .ic { width: 15px; height: 15px; stroke-width: 2.6; }
.timeline li.is-done .tl-dot { background: var(--ink); border-color: var(--ink); color: #fff; }
.timeline li.is-on .tl-dot { background: var(--glove); border-color: var(--glove-2); color: #fff; }
.tl-txt { display: grid; line-height: 1.3; }
.tl-txt strong { font-size: 14px; }
.tl-txt small { font-size: 12px; color: var(--muted); }
.timeline li:not(.is-done):not(.is-on) .tl-txt strong { color: var(--muted); font-weight: 500; }
.timeline.is-off { opacity: .5; }
.mgrid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; margin-top: 16px; align-items: start; }
.mgrid > .panel + .panel { margin-top: 0; }
.info { margin: 0; display: grid; gap: 16px; }
.info div { display: grid; grid-template-columns: 22px 1fr; gap: 2px 12px; }
.info .ic { grid-row: span 2; color: var(--muted); margin-top: 2px; }
.info dt { font-size: 14px; color: var(--muted); }
.info dd { margin: 0; font-weight: 500; }
.person { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: var(--r); background: var(--paper); margin-bottom: 12px; }
.person-empty { color: var(--muted); }
.person-empty .ic { width: 28px; height: 28px; }
.person-txt { display: grid; flex: 1; min-width: 0; line-height: 1.3; }
.person-txt small { color: var(--muted); font-size: 13px; }
.person-txt strong { font-size: 17px; }
.person-phone { font-size: 14px; color: var(--ink-2); text-decoration: none; font-variant-numeric: tabular-nums; }
.person-rating { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.panel > .person:only-child, .stack .panel > .person { margin-bottom: 0; }
.stars { display: inline-flex; gap: 1px; }
.star { fill: var(--line); }
.star-full { fill: var(--star); }
.star-half { fill: var(--star); opacity: .55; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.actions-col { flex-direction: column; }
.money { margin: 0 0 16px; display: grid; }
.money div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1.5px solid var(--mist); }
.money dt { color: var(--ink-2); }
.money dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; display: grid; }
.money dd small { font-weight: 500; color: var(--muted); font-size: 13px; }
.money-total dd { color: var(--ok); }
.review blockquote { margin: 10px 0 0; font-size: 17px; color: var(--ink-2); }
.rate-stars { display: inline-flex; flex-direction: row-reverse; justify-content: flex-end; gap: 4px; border: 0; padding: 0; margin: 0; }
.rate-stars input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.rate-stars label { cursor: pointer; padding: 2px; border-radius: 8px; }
.rate-stars svg { width: 38px; height: 38px; fill: var(--line); transition: fill .1s, transform .1s; }
.rate-stars label:hover svg, .rate-stars label:hover ~ label svg,
.rate-stars input:checked ~ label svg { fill: var(--star); }
.rate-stars input:focus-visible + label { outline: 3px solid var(--lake); }
.chat .panel-title .ic { color: var(--muted); }
.thread { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; padding: 4px 2px 12px; }
.thread-empty { padding: 8px 0; }
.msg { display: grid; justify-items: start; gap: 3px; max-width: 80%; }
.msg-me { align-self: flex-end; justify-items: end; }
.msg-bubble { padding: 10px 14px; border-radius: 16px 16px 16px 4px; background: var(--paper); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg-me .msg-bubble { background: var(--ink); color: #fff; border-radius: 16px 16px 4px 16px; }
.msg small { font-size: 12px; color: var(--muted); }
.chat-form { display: flex; gap: 8px; align-items: flex-end; border-top: 1.5px solid var(--mist); padding-top: 12px; }
.chat-form textarea { min-height: 48px; max-height: 140px; resize: none; }
.chat-form .icon-btn { width: 48px; height: 48px; }

/* ---------------------------------------------------------------- panneau modal */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(15, 39, 65, .45); opacity: 0; transition: opacity .2s; }
.sheet {
  position: relative; width: 100%; max-width: 480px; max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--surface);
  border-radius: var(--r-lg); padding: 26px; transform: translateY(12px); opacity: 0; transition: transform .22s ease, opacity .22s;
}
.sheet-wrap.in .sheet-backdrop { opacity: 1; }
.sheet-wrap.in .sheet { transform: none; opacity: 1; }
.sheet h2 { font-size: 22px; margin-bottom: 8px; }
.sheet-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
.pick-list { display: grid; gap: 6px; margin-top: 14px; }
.pick { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); cursor: pointer; text-align: left; }
.pick:hover { border-color: var(--ink); }
.pick.is-on { border-color: var(--ink); background: var(--paper); }
.pick-txt { display: grid; flex: 1; line-height: 1.3; }
.pick-txt small { color: var(--muted); }
.pick-more { margin-top: 14px; }
.pick-more summary { cursor: pointer; font-weight: 600; color: var(--ink-2); }

/* ---------------------------------------------------------------- notifications */
#toasts { position: fixed; z-index: 60; left: 50%; bottom: calc(24px + var(--safe-b)); transform: translateX(-50%); display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); pointer-events: none; }
.toast { padding: 13px 16px; border-radius: 14px; background: var(--ink); color: #fff; font-weight: 600; font-size: 15px; box-shadow: 0 10px 30px -10px rgba(15, 39, 65, .5); animation: toast-in .2s ease; transition: opacity .3s, transform .3s; }
.toast-ok { border-left: 5px solid #47c28c; }
.toast-bad { background: #7d2419; }
.toast.out { opacity: 0; transform: translateY(6px); }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }

/* ---------------------------------------------------------------- prestataire */
.gate { background: var(--surface); border-radius: var(--r-lg); padding: 28px; display: grid; gap: 10px; }
.gate h2 { font-size: 22px; }
.checklist { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 4px; }
.checklist li { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--paper); font-weight: 600; color: var(--muted); }
.checklist li .ic { width: 22px; height: 22px; }
.checklist li.is-done { color: var(--ink); }
.checklist li.is-done .ic { color: var(--ok); }
.checklist .link { margin-left: auto; }
.offer-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
.offer-top { display: flex; gap: 12px; align-items: flex-start; }
.offer-top > div { flex: 1; min-width: 0; }
.offer-top h3 { font-size: 18px; }
.offer-top p { font-size: 14px; }
.offer-facts { margin: 16px 0 0; display: grid; gap: 8px; }
.offer-facts div { display: flex; align-items: center; gap: 10px; }
.offer-facts .ic { color: var(--muted); width: 18px; height: 18px; }
.offer-facts dd { margin: 0; font-weight: 600; }
.offer-stub { flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; background-color: var(--glove-soft); color: var(--ink); }
.offer-stub .stub-label, .offer-stub .stub-sub { color: var(--ink-2); }
.offer-stub::before { border-top-color: rgba(15, 39, 65, .28); }
.offer-stub .price { font-size: 28px; display: block; }
.offer-stub .btn-primary { background: var(--ink); border-color: var(--ink); color: #fff; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
.stat { background: var(--surface); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 2px; box-shadow: 0 1px 2px rgba(15, 39, 65, .05); }
.stat span { font-size: 14px; font-weight: 600; color: var(--ink-2); }
.stat strong { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1.15; }
.stat small { color: var(--muted); font-size: 13px; }
.stat-accent { background: var(--glove); color: #fff; }
.stat-accent span, .stat-accent small { color: rgba(255, 255, 255, .9); }

/* ---------------------------------------------------------------- graphique */
.chart { position: relative; }
.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.chart-head .panel-title { margin: 0; }
.chart-head .muted { font-size: 14px; }
.plot { position: relative; height: 200px; margin: 12px 0 0 44px; }
.plot-grid { position: absolute; inset: 0 0 26px 0; }
.plot-line { position: absolute; left: 0; right: 0; border-top: 1px solid var(--mist); }
.plot-line span { position: absolute; right: calc(100% + 8px); transform: translateY(-50%); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.plot-cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.bcol { display: grid; grid-template-rows: 1fr 26px; justify-items: center; outline: none; cursor: default; min-width: 0; }
.bcol:focus-visible { outline: 2px solid var(--lake); outline-offset: -2px; }
.bslot { width: 100%; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--line); }
.bar { width: min(24px, 60%); border-radius: 4px 4px 0 0; background: var(--lake); min-height: 0; }
.bar-now { background: var(--ink); }
.bcol:hover .bar, .bcol:focus .bar { background: #1c4a85; }

<script>
/* Moteur de prix Proova — doit rester identique à public.compute_quote (schema.sql).
   tests/test_pricing_parity.mjs compare les deux sur des milliers de cas. */
(function (root) {
  const SERVICES = {
    home: {
      label: 'Maison & appartement',
      short: 'Maison',
      unit: 'surface',
      min: 15, max: 300, default: 70, step: 5,
      formulas: {
        regular: { label: 'Entretien', desc: 'Sols, poussière, cuisine, salle de bain.', mult: 1 },
        deep:    { label: 'Grand nettoyage', desc: 'Tout l’entretien, plus les recoins, plinthes et placards.', mult: 1.6 },
        move:    { label: 'Fin de bail', desc: 'Remise des clés : appartement vide, nettoyé de fond en comble.', mult: 3.2 },

      options: {
        windows: { label: 'Vitres', hours: (s) => s / 40 },

        fridge:  { label: 'Frigo', hours: () => 0.5 },

        ironing: { label: 'Repassage (1 h)', hours: () => 1 },
      },
    },
    office: {
      label: 'Bureaux & locaux',
      short: 'Locaux',
      unit: 'surface',
      min: 20, max: 400, default: 120, step: 10,
      formulas: {
        standard:     { label: 'Entretien', desc: 'Postes de travail, sols, sanitaires, poubelles.', mult: 1 },
        deep:         { label: 'Grand nettoyage', desc: 'Dépoussiérage complet, mobilier, recoins.', mult: 1.7 },
      },
      options: {
        windows:  { label: 'Vitres', hours: (s) => s / 50 },
        sanitary: { label: 'Détartrage sanitaires', hours: () => 0.5 },
        kitchen:  { label: 'Cuisine & électroménager', hours: () => 0.5 },
        floor:    { label: 'Shampoing moquette', hours: (s) => s / 80 },
      },
    },
    car: {
      label: 'Voiture',
      short: 'Voiture',
      unit: 'size',
      formulas: {
        exterior: { label: 'Extérieur', desc: 'Lavage à la main, jantes, vitres.', base: 49, hours: 1 },
        interior: { label: 'Intérieur', desc: 'Aspiration, plastiques, vitres intérieures.', base: 79, hours: 1.5 },
        complete: { label: 'Complet', desc: 'Intérieur et extérieur.', base: 119, hours: 2.5 },
        premium:  { label: 'Détailing', desc: 'Complet, plus décontamination et protection carrosserie.', base: 189, hours: 4 },
      },
      sizes: {
        city:  { label: 'Citadine', mult: 1 },
        sedan: { label: 'Berline', mult: 1.15 },
        suv:   { label: 'SUV', mult: 1.3 },
        van:   { label: 'Utilitaire', mult: 1.5 },
      },
      options: {
        pet_hair:   { label: 'Poils d’animaux', flat: 25 },
        seats:      { label: 'Shampoing sièges', flat: 40 },
        engine:     { label: 'Compartiment moteur', flat: 30 },
      },
    },
    outdoor: {
      label: 'Extérieur & terrain',
      short: 'Extérieur',
      unit: 'surface',
      min: 5, max: 300, default: 40, step: 5,
      formulas: {
        terrace:   { label: 'Terrasse & balcon', desc: 'Haute pression, mousses, joints.', rate: 30 },
        garden:    { label: 'Jardin', desc: 'Feuilles, désherbage, allées.', rate: 60 },
      },
      options: {
        furniture: { label: 'Mobilier de jardin', hours: () => 0.75 },
        waste:     { label: 'Évacuation des déchets verts', flat: 60 },
      },
    },
  };

  const DEFAULT_SETTINGS = {
    currency: 'CHF', hourly_rate: 45, commission_rate: 0.2, urgent_surcharge: 0.2,
    service_area: 'Lausanne et région', contact_phone: '',
  };

  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  // Arrondis alignés sur PostgreSQL (half away from zero, valeurs positives)
  const roundQ = (h) => Math.round(h * 4 + 1e-9) / 4;
  const round5 = (x) => Math.round(x / 5 + 1e-9) * 5;

  function quote(service, formula, details, scheduledAt, settings, now) {
    const s = Object.assign({}, DEFAULT_SETTINGS, settings || {});
    const rate = Number(s.hourly_rate);
    const factor = rate / 45;
    const def = SERVICES[service];
    if (!def) throw new Error('Service inconnu');
    const f = def.formulas[formula];
    if (!f) throw new Error('Formule inconnue');
    const d = details || {};
    const opts = Array.isArray(d.options) ? d.options : [];
    const has = (k) => opts.includes(k);
    let surface = Number(d.surface) || 0;
    let h = 0, flat = 0, total = 0;

    if (service === 'home' || service === 'office') {
      surface = clamp(surface, def.min, def.max);
      const divisor = service === 'home' ? 22 : 35;
      const minH = service === 'home' ? 2.5 : 2;
      h = Math.max(minH, surface / divisor * f.mult);
      for (const [k, o] of Object.entries(def.options)) if (has(k)) h += o.hours(surface);
      h = roundQ(h);
      total = h * rate;
    } else if (service === 'car') {
      const size = (def.sizes[d.size] || def.sizes.city).mult;
      h = f.hours;
      for (const [k, o] of Object.entries(def.options)) if (has(k)) flat += o.flat;
      total = (f.base * size + flat) * factor;
    } else if (service === 'outdoor') {
      surface = clamp(surface, def.min, def.max);
      h = Math.max(2, surface / f.rate);
      if (has('furniture')) h += 0.75;
      h = roundQ(h);
      if (has('waste')) flat += 60 * factor;
      total = h * rate + flat;
    }

    const nowMs = now != null ? now : Date.now();
    const urgent = scheduledAt != null && new Date(scheduledAt).getTime() < nowMs + 24 * 3600 * 1000;

  function rebase(db) {
    const day = 24 * 3600e3;
    const shift = Math.floor((Date.now() - (db.seededAt || Date.now())) / day) * day;
    if (shift < day) return false;
    const move = (o, keys) => keys.forEach((k) => { if (o[k]) o[k] = new Date(new Date(o[k]).getTime() + shift).toISOString(); });
    Object.values(db.missions).forEach((m) => move(m, ['scheduled_at', 'created_at', 'accepted_at', 'started_at', 'completed_at', 'cancelled_at', 'rated_at']));
    Object.values(db.profiles).forEach((p) => move(p, ['created_at']));
    db.messages.forEach((m) => move(m, ['created_at']));
    db.seededAt += shift;
    return true;

      const me = this._need(db);

      if (!m || !(m.client_id === me.id || m.provider_id === me.id || me.role === 'admin')) return null;
      return clone(m);
    }

    async acceptMission(id) {
      return this._tx((db) => {
        const me = this._need(db);
        if (me.role !== 'provider' || me.provider_status !== 'approved') {
          throw new ApiError('Votre compte prestataire doit être validé pour accepter des missions');
        }
        const m = db.missions[id];
        if (!m || m.status !== 'pending' || m.provider_id || m.client_id === me.id || !(me.services || []).includes(m.service)) {
          throw new ApiError('Cette mission vient d’être prise ou n’est plus disponible');
        }
        Object.assign(m, { provider_id: me.id, status: 'accepted', accepted_at: nowIso() });
        return clone(m);
      });
    }

    async advanceMission(id, status) {
      return this._tx((db) => {
        const me = this._need(db);
        const m = db.missions[id];
        if (!m) throw new ApiError('Mission introuvable');
        if (m.provider_id !== me.id && me.role !== 'admin') throw new ApiError('Cette mission ne vous est pas attribuée');
        const okStep = (m.status === 'accepted' && ['on_the_way', 'in_progress'].includes(status))
          || (m.status === 'on_the_way' && status === 'in_progress') || (m.status === 'in_progress' && status === 'done');
        if (!okStep) throw new ApiError('Étape impossible depuis le statut actuel');
        m.status = status;
        if (status === 'in_progress') m.started_at = nowIso();
        if (status === 'done') m.completed_at = nowIso();
        return clone(m);
      });
    }

    async releaseMission(id) {
      return this._tx((db) => {
        const me = this._need(db);
        const m = db.missions[id];
        if (!m || m.provider_id !== me.id || m.status !== 'accepted') throw new ApiError('Vous ne pouvez plus vous désister de cette mission');
        Object.assign(m, { provider_id: null, status: 'pending', accepted_at: null });
        return clone(m);
      });
    }

    async cancelMission(id, reason) {
      return this._tx((db) => {
        const me = this._need(db);
        const m = db.missions[id];
        if (!m) throw new ApiError('Mission introuvable');
        if (me.role === 'admin') {
          if (['done', 'cancelled'].includes(m.status)) throw new ApiError('Mission déjà clôturée');
        } else if (m.client_id === me.id) {
          if (!['pending', 'accepted'].includes(m.status)) throw new ApiError('Le prestataire est déjà en route : contactez-le directement');
        } else throw new ApiError('Action non autorisée');
        Object.assign(m, { status: 'cancelled', cancelled_at: nowIso(), cancel_reason: String(reason || '').slice(0, 300) });
        return clone(m);
      });
    }

    async rateMission(id, rating, review) {
      return this._tx((db) => {
        const me = this._need(db);
        rating = Number(rating);
        if (!(rating >= 1 && rating <= 5)) throw new ApiError('Note entre 1 et 5');
        const m = db.missions[id];
        if (!m || m.client_id !== me.id || m.status !== 'done' || m.rating) throw new ApiError('Cette mission ne peut pas être notée');
        Object.assign(m, { rating, review: String(review || '').slice(0, 1000), rated_at: nowIso() });
        if (m.provider_id && db.profiles[m.provider_id]) {
          const rs = Object.values(db.missions).filter((x) => x.provider_id === m.provider_id && x.rating);
          const p = db.profiles[m.provider_id];
          p.rating_count = rs.length;
          p.rating_avg = Math.round(rs.reduce((a, x) => a + x.rating, 0) / rs.length * 100) / 100;
        }
        return clone(m);
      });
    }

    // --- messages
    async listMessages(missionId) {
      const db = this._read();
      const me = this._need(db);
      const m = db.missions[missionId];
      if (!m || !(m.client_id === me.id || m.provider_id === me.id || me.role === 'admin')) return [];
      return clone(db.messages.filter((x) => x.mission_id === missionId).sort((a, b) => a.created_at.localeCompare(b.created_at)));
    }

    async sendMessage(missionId, body) {
      body = String(body || '').trim();
      if (!body) throw new ApiError('Message vide');
      if (body.length > 1000) throw new ApiError('Message trop long (1000 caractères maximum)');
      return this._tx((db) => {
        const me = this._need(db);
        const m = db.missions[missionId];
        const part = m && (m.client_id === me.id || m.provider_id === me.id);
        if (!m || !(me.role === 'admin' || (part && m.status !== 'cancelled'))) throw new ApiError('Conversation fermée');
        const msg = { id: uuid(), mission_id: missionId, sender_id: me.id, body, created_at: nowIso() };
        db.messages.push(msg);
        return clone(msg);
      });
    }

    // --- administration
    async listProfiles() {
      const db = this._read();
      this._admin(db);
      return clone(Object.values(db.profiles).sort((a, b) => b.created_at.localeCompare(a.created_at)));
    }

    async assignMission(id, providerId) {
      return this._tx((db) => {
        this._admin(db);
        const p = db.profiles[providerId];
        if (!p || p.role !== 'provider' || p.provider_status !== 'approved') throw new ApiError('Ce prestataire n’est pas validé');
        const m = db.missions[id];
        if (!m || !['pending', 'accepted'].includes(m.status)) throw new ApiError('Mission non attribuable');
        Object.assign(m, { provider_id: providerId, status: 'accepted', accepted_at: nowIso() });
        return clone(m);
      });
    }

    async setProviderStatus(userId, status) {
      return this._tx((db) => {
        this._admin(db);
        if (!['pending', 'approved', 'suspended'].includes(status)) throw new ApiError('Statut inconnu');
        const p = db.profiles[userId];
        if (!p || p.role !== 'provider') throw new ApiError('Prestataire introuvable');
        p.provider_status = status;
        return clone(p);
      });
    }

    async setPayment(id, status) {
      return this._tx((db) => {
        this._admin(db);
        if (!['unpaid', 'paid'].includes(status)) throw new ApiError('Statut inconnu');
        const m = db.missions[id];
        if (!m) throw new ApiError('Mission introuvable');
        m.payment_status = status;
        return clone(m);
      });
    }
  }

/* Backend de production : Supabase (authentification + PostgreSQL + sécurité RLS).
   Toutes les règles métier sont appliquées côté serveur par supabase/schema.sql. */
(function (root) {
  const SDK_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  const AUTH_MESSAGES = [
    [/invalid login credentials/i, 'Email ou mot de passe incorrect'],
    [/already registered|already been registered|user already exists/i, 'Un compte existe déjà avec cet email'],
    [/email not confirmed/i, 'Confirmez d’abord votre email : cliquez sur le lien reçu par mail'],
    [/password should be at least/i, 'Le mot de passe doit faire au moins 8 caractères'],
    [/for security purposes|rate limit|too many requests/i, 'Trop de tentatives : patientez une minute puis réessayez'],
    [/unable to validate email|invalid format|email address .* is invalid/i, 'Adresse email invalide'],
    [/failed to fetch|network/i, 'Connexion au serveur impossible. Vérifiez votre réseau.'],
    [/jwt expired|invalid jwt/i, 'Session expirée : reconnectez-vous'],
  ];

  class SupabaseBackend {
    constructor(cfg) {
      this.mode = 'live';
      this.cfg = cfg;
      this.session = null;
      this.authListeners = new Set();
      this.dataListeners = new Set();
    }

    _err(error) {
      const msg = (error && (error.message || error.error_description)) || 'Erreur inconnue';
      for (const [re, fr] of AUTH_MESSAGES) if (re.test(msg)) return new root.ApiError(fr);
      return new root.ApiError(msg);
    }
    async _q(promise) {
      const { data, error } = await promise;
      if (error) throw this._err(error);
      return data;
    }
    _uid() {
      if (!this.session) throw new root.ApiError('Connexion requise');
      return this.session.user.id;
    }

    async init() {
      this.recovery = /type=recovery/.test(root.location.hash);
      const { createClient } = await import(SDK_URL);
      this.sb = createClient(this.cfg.supabaseUrl, this.cfg.supabaseAnonKey, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' },
      });
      const { data } = await this.sb.auth.getSession();
      this.session = data.session;
      this.sb.auth.onAuthStateChange((event, session) => {
        const changedUser = (session && session.user.id) !== (this.session && this.session.user.id);
        this.session = session;
        if (event === 'PASSWORD_RECOVERY') this.recovery = true;
        if (changedUser || event === 'PASSWORD_RECOVERY' || event === 'SIGNED_OUT') {
          this.authListeners.forEach((f) => f(event));
        }
      });
    }

    onAuthChange(cb) { this.authListeners.add(cb); }
    onDataChange(cb) { this.dataListeners.add(cb); }

    getSession() {
      return this.session ? { user: { id: this.session.user.id, email: this.session.user.email } } : null;
    }

    _redirect() { return root.location.origin + root.location.pathname; }

    async signUp({ email, password, full_name, phone, city, role, services, country, postal_code, application }) {
      if (String(password || '').length < 8) throw new root.ApiError('Le mot de passe doit faire au moins 8 caractères');
      const data = await this._q(this.sb.auth.signUp({
        email: String(email).trim(), password,
        options: {
          data: { full_name, phone, city, role, services: services || [], country: country || null,
            postal_code: postal_code || '', application: application || {} },
          emailRedirectTo: this._redirect(),
        },
      }));
      // Supabase renvoie un utilisateur sans identités quand l'email existe déjà
      if (data.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) {
        throw new root.ApiError('Un compte existe déjà avec cet email');
      }
      return { needsConfirmation: !data.session };
    }

    async signIn(email, password) {
      await this._q(this.sb.auth.signInWithPassword({ email: String(email).trim(), password }));
    }

    async signOut() { await this.sb.auth.signOut(); }

    async requestPasswordReset(email) {
      await this._q(this.sb.auth.resetPasswordForEmail(String(email).trim(), { redirectTo: this._redirect() }));
      return true;
    }

    async updatePassword(password) {
      if (String(password || '').length < 8) throw new root.ApiError('Le mot de passe doit faire au moins 8 caractères');
      await this._q(this.sb.auth.updateUser({ password }));
      this.recovery = false;
    }

    // --- profil
    async getProfile() {
      if (!this.session) return null;
      return this._q(this.sb.from('profiles').select('*').eq('id', this._uid()).maybeSingle());
    }

    async updateProfile(fields) {
      const allowed = {};
      for (const k of ['full_name', 'phone', 'city', 'services', 'bio', 'available', 'country', 'postal_code', 'application']) {
        if (k in fields) allowed[k] = fields[k];
      }
      return this._q(this.sb.from('profiles').update(allowed).eq('id', this._uid()).select().single());
    }

    async becomeProvider(services, bio, city) {
      return this._q(this.sb.rpc('become_provider', { p_services: services, p_bio: bio || '', p_city: city || '' }));
    }

    async getProfiles(ids) {
      const list = [...new Set(ids.filter(Boolean))];
      if (!list.length) return {};
      const rows = await this._q(this.sb.from('profiles')
        .select('id, full_name, phone, city, role, rating_avg, rating_count, services, provider_status').in('id', list));
      return Object.fromEntries(rows.map((r) => [r.id, r]));
    }

    // --- réglages & admin
    async getSettings() {
      return this._q(this.sb.from('settings').select('*').eq('id', 1).single());
    }

    async updateSettings(fields) {
      const allowed = { updated_at: new Date().toISOString() };
      for (const k of ['currency', 'hourly_rate', 'commission_rate', 'urgent_surcharge', 'service_area', 'contact_phone']) {
        if (k in fields) allowed[k] = fields[k];
      }
      const rows = await this._q(this.sb.from('settings').update(allowed).eq('id', 1).select());
      if (!rows.length) throw new root.ApiError('Réservé à l’administration');
      return rows[0];
    }

    async adminExists() { return this._q(this.sb.rpc('admin_exists')); }
    async claimAdmin() { return this._q(this.sb.rpc('claim_admin')); }

    // --- missions
    async createMission(d) {
      const row = {
        service: d.service, formula: d.formula, details: d.details || {}, address: d.address,
        postal_code: d.postal_code || '', city: d.city, scheduled_at: d.scheduled_at,
        contact_name: d.contact_name || '', contact_phone: d.contact_phone, notes: d.notes || '',
        client_id: this._uid(),
      };
      return this._q(this.sb.from('missions').insert(row).select().single());
    }

    async listMyMissions() {
      return this._q(this.sb.from('missions').select('*').eq('client_id', this._uid())
        .order('scheduled_at', { ascending: false }).limit(500));
    }
    async listProviderMissions() {
      return this._q(this.sb.from('missions').select('*').eq('provider_id', this._uid())
        .order('scheduled_at', { ascending: false }).limit(500));
    }
    async listAllMissions() {
      return this._q(this.sb.from('missions').select('*').order('scheduled_at', { ascending: false }).limit(1000));
    }
    async listOpenMissions() { return this._q(this.sb.rpc('list_open_missions')); }

    async getMission(id) {
      return this._q(this.sb.from('missions').select('*').eq('id', id).maybeSingle());
    }

    async acceptMission(id) { return this._q(this.sb.rpc('accept_mission', { p_id: id })); }
    async advanceMission(id, status) { return this._q(this.sb.rpc('advance_mission', { p_id: id, p_status: status })); }
    async releaseMission(id) { return this._q(this.sb.rpc('release_mission', { p_id: id })); }
    async cancelMission(id, reason) { return this._q(this.sb.rpc('cancel_mission', { p_id: id, p_reason: reason || '' })); }
    async rateMission(id, rating, review) {
      return this._q(this.sb.rpc('rate_mission', { p_id: id, p_rating: rating, p_review: review || '' }));
    }

    // --- messages
    async listMessages(missionId) {
      return this._q(this.sb.from('messages').select('*').eq('mission_id', missionId)

    async sendMessage(missionId, body) {
      body = String(body || '').trim();
      if (!body) throw new root.ApiError('Message vide');
      return this._q(this.sb.from('messages').insert({ mission_id: missionId, body }).select().single());
    }

    async listProfiles() {
      return this._q(this.sb.from('profiles').select('*').order('created_at', { ascending: false }).limit(2000));
    }
    async assignMission(id, providerId) { return this._q(this.sb.rpc('admin_assign', { p_id: id, p_provider: providerId })); }
    async setProviderStatus(userId, status) {
      return this._q(this.sb.rpc('admin_set_provider_status', { p_user: userId, p_status: status }));
    }
    async setPayment(id, status) { return this._q(this.sb.rpc('admin_set_payment', { p_id: id, p_status: status })); }
  }

  root.SupabaseBackend = SupabaseBackend;
})(typeof window !== 'undefined' ? window : globalThis);

// Services proposés aux clients, dans l'ordre d'affichage. Bureaux et extérieur reviendront plus tard.
const ACTIVE_SERVICES = ['car', 'home'];
const liveServices = (keep) => Object.entries(P.SERVICES)
  .filter(([k]) => ACTIVE_SERVICES.includes(k) || (keep || []).includes(k))

// ---------------------------------------------------------------- promo de la semaine
// S'affiche quand le tarif horaire (Réglages admin) est à 36,45 = 40,50 - 10 %, jusqu'à la date de fin.
const PROMO = { label: 'Promo de la semaine', pct: 10, regularRate: 40.5, from: '2026-11-06T00:00:00', until: '2026-11-13T23:59:59', untilLabel: '13 novembre' };
function promoOn() {
  const now = Date.now();
  if (now < new Date(PROMO.from).getTime() || now > new Date(PROMO.until).getTime()) return false;
  const rate = Number(S.settings && S.settings.hourly_rate);
  return Math.abs(rate - PROMO.regularRate * (1 - PROMO.pct / 100)) < 0.1;
}
// Prix habituel (hors promo) d'un devis, ou null si pas de promo en cours
function regularPrice(service, formula, details, scheduledAt) {
  if (!promoOn()) return null;
  const was = P.quote(service, formula, details, scheduledAt, Object.assign({}, S.settings, { hourly_rate: PROMO.regularRate })).price;
  const now = P.quote(service, formula, details, scheduledAt, S.settings).price;
  return was > now ? was : null;
}
const wasTag = (was) => (was ? html`<s class="was">${fmtMoney(was)}</s>` : '');

function stars(n, size) {
  const r = Math.round(Number(n) * 2) / 2;
  let out = '';
  for (let i = 1; i <= 5; i++) {
    const fill = r >= i ? 'full' : r >= i - 0.5 ? 'half' : 'empty';
    out += `<svg class="star star-${fill}" width="${size || 14}" height="${size || 14}" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3.8 2.5 5.1 5.6.8-4 4 .9 5.6-5-2.7-5 2.7.9-5.6-4-4 5.6-.8z"/></svg>`;
  }
  return raw(`<span class="stars" role="img" aria-label="${r} sur 5">${out}</span>`);
}

// ---------------------------------------------------------------- notifications & panneaux
function toast(msg, tone) {
  let box = $('#toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('aria-live', 'polite'); document.body.appendChild(box); }
  const t = document.createElement('div');
  t.className = 'toast ' + (tone ? 'toast-' + tone : '');
  t.textContent = msg;
  box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  setTimeout(() => t.classList.add('out'), 3200);
  setTimeout(() => t.remove(), 3600);
}

function openSheet(content, opts) {
  closeSheet();
  const wrap = document.createElement('div');
  wrap.className = 'sheet-wrap';
  wrap.innerHTML = `<div class="sheet-backdrop" data-act="close-sheet"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">${str(content)}</div>`;
  document.body.appendChild(wrap);
  document.body.classList.add('no-scroll');
  requestAnimationFrame(() => wrap.classList.add('in'));
  const f = wrap.querySelector('[autofocus], input, textarea, select, button.btn-primary');
  if (f) setTimeout(() => f.focus(), 60);
  S.sheetOpts = opts || {};
}
function closeSheet() {
  const w = $('.sheet-wrap');
  if (w) w.remove();

function setBusy(el, busy, label) {
  if (!el) return;
  if (busy) {
    el.dataset.label = el.innerHTML;
    el.disabled = true;
    el.classList.add('is-busy');
    if (label) el.textContent = label;
  } else {
    el.disabled = false;
    el.classList.remove('is-busy');
    if (el.dataset.label) el.innerHTML = el.dataset.label;
  }
}

async function run(btn, fn, okMsg) {
  setBusy(btn, true);
  try {
    const out = await fn();
    if (okMsg) toast(okMsg, 'ok');
    return out;
  } catch (e) {
    toast(e && e.message ? e.message : 'Une erreur est survenue', 'bad');
    throw e;
  } finally {
    if (btn && btn.isConnected) setBusy(btn, false);
  }
}

function formData(form) {
  const out = {};
  for (const el of form.elements) {
    if (!el.name) continue;
    if (el.type === 'checkbox') {
      if (el.dataset.group) { (out[el.name] = out[el.name] || []); if (el.checked) out[el.name].push(el.value); } else out[el.name] = el.checked;
    } else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; } else out[el.name] = el.value.trim();
  }
  return out;
}

function store(kind) {

function loadDraft() { if (!DRAFTS) return null; try { return JSON.parse(DRAFTS.getItem('proova_booking')); } catch (e) { return null; } }

  provider: [['missions', 'Missions', 'inbox'], ['planning', 'Planning', 'calendar'], ['gains', 'Gains', 'wallet'], ['profil', 'Profil', 'user']],

};

function parseHash() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ''));
  if (!h) return { name: 'home' }; // l'adresse du site montre toujours la page d'accueil, connecté ou non
  if (/[=&?]/.test(h)) return { name: S.session ? 'role-home' : 'home' };
  if (h.startsWith('m-')) return { name: 'mission', id: h.slice(2) };
  return { name: ROUTES[h] || (S.session ? 'role-home' : 'home') };
}

function homeFor() {
  const r = role();
  if (r === 'admin') return 'admin';
  if (r === 'provider') return 'missions';
  return 'reservations';
}

function go(hash, replace) {
  const h = '#' + String(hash).replace(/^#/, '');
  if (replace) {
    try { history.replaceState(null, '', h); } catch (e) { location.hash = h; return; }
    navigate();
  } else if (location.hash === h) {
    navigate();
  } else {
    location.hash = h;
  }
}

function clearTimers() {
  S.timers.forEach((t) => clearInterval(t));
  S.timers = [];
}
function every(ms, fn) {
  S.timers.push(setInterval(() => { if (!document.hidden) fn(); }, ms));
}

async function navigate() {
  const token = ++S.navToken;
  clearTimers();
  closeSheet();
  let r = parseHash();
  if (S.api && S.api.recovery && r.name !== 'reset') return go('nouveau-mdp', true);
  if (r.name === 'role-home') return go(homeFor(), true);
  if (!PUBLIC.has(r.name) && !S.session) {
    S.afterLogin = location.hash;
    return go('connexion', true);
  }
  const adminPreview = S.session && role() === 'admin' && ['signup', 'signup-pro'].includes(r.name);
  if (S.session && !adminPreview && ['login', 'signup'].includes(r.name)) return go(S.afterLogin || homeFor(), true);
  if (S.session && !adminPreview && r.name === 'signup-pro') { S.openBecomePro = true; return go('profil', true); }
  if (ROLE_ONLY[r.name] && role() !== ROLE_ONLY[r.name]) return go(homeFor(), true);

  S.route = r;
  const view = VIEWS[r.name];
  S.view = {};
  if (view.load) {
    paint(view, true);
    try {
      S.view = (await view.load(r)) || {};
    } catch (e) {
      S.view = { error: e && e.message ? e.message : 'Chargement impossible' };
    }
    if (token !== S.navToken) return;
  }
  paint(view, false);
  window.scrollTo(0, 0);
  if (view.after) view.after(r);
  const h1 = $('#main h1, main h1');
  if (h1 && document.activeElement === document.body) { h1.setAttribute('tabindex', '-1'); h1.focus({ preventScroll: true }); }
}

// Recharge la vue courante sans perdre ce qui est en cours de saisie
async function refresh() {
  const r = S.route;
  const view = VIEWS[r.name];
  if (!view) return;
  const token = S.navToken;
  if (view.load) {
    try { S.view = (await view.load(r)) || {}; } catch (e) { return; }
    if (token !== S.navToken) return;
  }
  const kept = $$('[data-keep]').map((el) => ({
    key: el.dataset.keep, value: el.value, focus: document.activeElement === el,
    start: el.selectionStart, end: el.selectionEnd,
  }));
  const y = window.scrollY;
  paint(view, false);
  for (const k of kept) {
    const el = $(`[data-keep="${k.key}"]`);
    if (!el) continue;
    el.value = k.value;
    if (k.focus) { el.focus({ preventScroll: true }); try { el.setSelectionRange(k.start, k.end); } catch (e) { /* type sans sélection */ } }
  }
  window.scrollTo(0, y);
  if (view.after) view.after(r, true);
}

function paint(view, loading) {
  const root = $('#app');
  const body = loading ? skeleton() : S.view.error ? errorState(S.view.error) : view.render(S.route);
  if (view.layout === 'public') root.innerHTML = str(body);
  else if (view.layout === 'auth') root.innerHTML = str(authLayout(body));
  else if (view.layout === 'plain') root.innerHTML = str(plainLayout(body));
  else root.innerHTML = str(appShell(body));
  document.title = (view.title ? view.title() + ' | ' : '') + 'Proova';
}

}

document.addEventListener('click', (e) => {

  const a = e.target.closest('[data-act]');

function newBooking() {
  return {
    step: 0, service: 'car', formula: 'exterior', surface: 70, size: 'city', options: [], car_model: '',
    day: null, time: null, address: '', postal_code: '', city: '', contact_name: '', contact_phone: '', notes: '',
  };
}
function ensureBooking() {
  if (!S.booking) {
    const draft = loadDraft();
    S.booking = draft && ACTIVE_SERVICES.includes(draft.service) ? Object.assign(newBooking(), draft) : newBooking();
  }
  return S.booking;
}
function setService(b, service) {
  const def = P.SERVICES[service];
  b.service = service;
  b.formula = Object.keys(def.formulas)[0];
  b.options = [];
  if (def.unit === 'surface') b.surface = def.default;
  else b.size = 'city';
}
function detailsOf(b) {
  const def = P.SERVICES[b.service];
  const det = { options: b.options.filter((o) => def.options[o]) };
  if (def.unit === 'surface') det.surface = Number(b.surface);
  else det.size = b.size;
  return det;
}
function scheduledIso(b) {
  if (!b.day || !b.time) return null;
  const [y, m, dd] = b.day.split('-').map(Number);
  const [hh, mm] = b.time.split(':').map(Number);
  return new Date(y, m - 1, dd, hh, mm, 0, 0).toISOString();
}
function bookingQuote(b, withDate) {
  return P.quote(b.service, b.formula, detailsOf(b), withDate ? scheduledIso(b) : null, S.settings);
}
function fromPrice(service) {
  const def = P.SERVICES[service];
  return Math.min(...Object.keys(def.formulas).map((f) =>
    P.quote(service, f, def.unit === 'surface' ? { surface: def.min } : { size: 'city' }, null, S.settings).price));
}
function fromRegular(service) {
  if (!promoOn()) return null;
  const def = P.SERVICES[service];
  const was = Math.min(...Object.keys(def.formulas).map((f) =>
    regularPrice(service, f, def.unit === 'surface' ? { surface: def.min } : { size: 'city' }, null) || 0).filter(Boolean));
  return isFinite(was) && was > fromPrice(service) ? was : null;
}
const bookingRegular = (b, withDate) => regularPrice(b.service, b.formula, detailsOf(b), withDate ? scheduledIso(b) : null);

FORMS.signup = async (form, btn) => {
  if (S.session) { formError(form, 'Aperçu seulement : déconnectez-vous ou ouvrez un onglet privé pour tester une inscription.'); return; }
  const f = formData(form);
  if (!f.full_name || f.full_name.length < 2) return formError(form, 'Indiquez votre nom.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email || '')) return formError(form, 'Adresse email invalide.');
  if (!f.phone || f.phone.replace(/\D/g, '').length < 8) return formError(form, 'Numéro de téléphone incomplet.');
  if (f.role === 'provider' && !(f.services || []).length) return formError(form, 'Choisissez au moins un service.');
  const app = f.role === 'provider' ? readApplication(form) : null;
  if (app && app.error) return formError(form, app.error);
  if ((f.password || '').length < 8) return formError(form, 'Le mot de passe doit faire au moins 8 caractères.');
  formError(form, '');
  setBusy(btn, true, 'Création du compte…');
  try {
    S.pendingServices = f.role === 'provider' ? f.services : null;
    const res = await S.api.signUp({
      email: f.email, password: f.password, full_name: f.full_name, phone: f.phone,
      city: app ? app.city : (f.city || ''), role: f.role, services: f.services || [],
      country: app ? app.country : null, postal_code: app ? app.postal_code : '', application: app ? app.application : {},
    });
    if (res.needsConfirmation) {
      $('.auth-card').innerHTML = str(html`<div class="done-state">${icon('send', 'ic-xl')}<h1>Vérifiez votre boîte mail</h1>
        <p>Nous avons envoyé un lien de confirmation à <strong>${f.email}</strong>. Cliquez dessus pour activer votre compte,
        puis revenez ici.</p><a class="btn" href="#connexion">J’ai confirmé, me connecter</a></div>`);
    }
  } catch (e) {
    formError(form, e.message);
  } finally { if (btn.isConnected) setBusy(btn, false); }
};

// Lit et vérifie la candidature. Renvoie { error } ou { country, city, postal_code, application }.
function readApplication(form) {
  const f = formData(form);
  if (!f.country) return { error: 'Choisissez votre pays.' };
  if (!f.city) return { error: 'Indiquez votre ville.' };
  if (f.city_ok !== '1' && !S.cityApiDown) return { error: 'Choisissez votre ville dans la liste proposée.' };
  if (!f.qualification) return { error: 'Indiquez votre qualification.' };
  if (!f.experience) return { error: 'Indiquez vos années d’expérience.' };
  if (!f.equipment_level) return { error: 'Dites-nous si vous avez du matériel.' };
  const level = f.equipment_level;
  return {
    country: f.country,
    city: f.city.slice(0, 80),
    postal_code: (f.postal_code || '').slice(0, 12),
    application: {
      qualification: f.qualification,
      experience: f.experience,
      equipment_level: level,
      equipment: level === 'none' ? [] : (f.equipment || []).filter((k) => EQUIPMENT[k]),
      vehicle: !!f.vehicle,
      availability: Math.min(5, Math.max(1, Number(f.availability) || 3)),
      slots: (f.slots || []).filter((k) => PREF_SLOTS[k]),
      siret: (f.siret || '').slice(0, 20),
      insured: !!f.insured,
    },
  };
}

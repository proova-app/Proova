// ---------------------------------------------------------------- ville vérifiée (annuaire officiel)
const ACCENTS = { a: 'aàâä', e: 'eéèêë', i: 'iîï', o: 'oôö', u: 'uùûü', c: 'cç', y: 'yÿ', n: 'nñ' };
function looseRegex(q) {
  let out = '^';
  for (const ch of q) {
    const base = ch.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    if (/[a-z]/.test(base)) {
      const set = ACCENTS[base] || base;
      out += `[${set}${set.toUpperCase()}]`;
    } else if (/[\s\-']/.test(ch)) out += "[ \\-']";
    else if (/[0-9]/.test(ch)) out += ch;
    else out += '.';
  }
  return out;
}

async function citiesFR(q, signal) {
  const r = await fetch(`https://geo.api.gouv.fr/communes?nom=${encodeURIComponent(q)}&fields=nom,codesPostaux,departement&boost=population&limit=8`, { signal });
  if (!r.ok) throw new Error('http ' + r.status);
  const data = await r.json();
  return data.map((c) => ({ name: c.nom, npa: (c.codesPostaux || [])[0] || '', region: c.departement ? c.departement.code : '' }));
}

async function citiesCH(q, signal) {
  const r = await fetch(`https://openplzapi.org/ch/Localities?name=${encodeURIComponent(looseRegex(q))}&page=1&pageSize=50`, { signal });
  if (!r.ok) throw new Error('http ' + r.status);
  const data = await r.json();
  const seen = new Map();
  for (const l of data) {
    const name = String(l.name || '').replace(/\s+\d+$/, '');
    const region = l.canton ? l.canton.shortName : '';
    const npa = String(l.postalCode || l.postalcode || '');
    const key = name + '|' + region;
    if (!seen.has(key) || npa < seen.get(key).npa) seen.set(key, { name, npa, region });
  }
  const low = q.toLowerCase();
  return [...seen.values()]
    .sort((a, b) => (b.name.toLowerCase() === low) - (a.name.toLowerCase() === low) || a.name.length - b.name.length || a.name.localeCompare(b.name))
    .slice(0, 8);
}

let cityTimer = null;
let cityReq = 0;
function cityHint(box, text, tone) {
  const h = box.querySelector('.city-hint');
  h.textContent = text;
  h.className = 'city-hint' + (tone ? ' is-' + tone : '');
}
function closeCombo(box) {
  const list = box.querySelector('.combo-list');
  list.hidden = true;
  list.innerHTML = '';
  const input = box.querySelector('[name=city]');
  input.setAttribute('aria-expanded', 'false');
  input.removeAttribute('aria-activedescendant');
}
INPUTS['city-search'] = (el) => {
  const box = el.closest('[data-cityf]');
  box.querySelector('[name=city_ok]').value = '';
  box.querySelector('[name=postal_code]').value = '';
  clearTimeout(cityTimer);
  const q = el.value.trim();
  if (q.length < 2) { closeCombo(box); cityHint(box, 'Choisissez votre ville dans la liste.'); return; }
  cityTimer = setTimeout(() => searchCities(box, q), 250);
};
async function searchCities(box, q) {
  const id = ++cityReq;
  const country = (box.querySelector('[name=country]:checked') || {}).value || 'CH';
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 6000);
  cityHint(box, 'Recherche…');
  try {
    const list = country === 'FR' ? await citiesFR(q, ctrl.signal) : await citiesCH(q, ctrl.signal);
    if (id !== cityReq) return;
    S.cityApiDown = false;
    renderCombo(box, list);
  } catch (e) {
    if (id !== cityReq) return;
    S.cityApiDown = true;
    closeCombo(box);
    cityHint(box, 'Vérification des villes indisponible pour le moment : vérifiez simplement l’orthographe.', 'warn');
  } finally { clearTimeout(timer); }
}
function renderCombo(box, list) {
  const ul = box.querySelector('.combo-list');
  const input = box.querySelector('[name=city]');
  if (!list.length) { closeCombo(box); cityHint(box, 'Aucune ville trouvée. Vérifiez l’orthographe ou le pays.', 'warn'); return; }
  ul.innerHTML = str(html`${list.map((c, i) => html`<li role="option" id="city-opt-${i}" aria-selected="false" data-act="city-pick"
    data-name="${c.name}" data-npa="${c.npa}">${c.name}<small>${c.region ? `${c.region}, ` : ''}${c.npa}</small></li>`)}`);
  ul.hidden = false;
  input.setAttribute('aria-expanded', 'true');
  cityHint(box, `${list.length} ville${list.length > 1 ? 's' : ''} trouvée${list.length > 1 ? 's' : ''} : touchez la vôtre.`);
}
function pickCity(li) {
  const box = li.closest('[data-cityf]');
  box.querySelector('[name=city]').value = li.dataset.name;
  box.querySelector('[name=postal_code]').value = li.dataset.npa;
  box.querySelector('[name=city_ok]').value = '1';
  closeCombo(box);
  cityHint(box, `Ville vérifiée, code postal ${li.dataset.npa}`, 'ok');
  const err = box.closest('form') && box.closest('form').querySelector('.form-error');
  if (err && /ville/i.test(err.textContent)) { err.textContent = ''; err.hidden = true; }
}
ACTIONS['city-pick'] = (li) => pickCity(li);
// Revenir dans la case rouvre les suggestions tant que la ville n'est pas choisie
document.addEventListener('focusin', (e) => {
  const input = e.target.closest && e.target.closest('[data-input="city-search"]');
  if (!input) return;
  const box = input.closest('[data-cityf]');
  if (box.querySelector('[name=city_ok]').value !== '1' && input.value.trim().length >= 2) searchCities(box, input.value.trim());
});
CHANGES['city-country'] = (el) => {
  const box = el.closest('[data-cityf]');
  const input = box.querySelector('[name=city]');
  input.value = '';
  box.querySelector('[name=city_ok]').value = '';
  box.querySelector('[name=postal_code]').value = '';
  closeCombo(box);
  cityHint(box, 'Choisissez votre ville dans la liste.');
  input.focus();
};
document.addEventListener('keydown', (e) => {
  const input = e.target.closest && e.target.closest('[data-input="city-search"]');
  if (!input) return;
  const box = input.closest('[data-cityf]');
  const opts = $$('[role=option]', box);
  if (!opts.length || box.querySelector('.combo-list').hidden) return;
  let i = opts.findIndex((o) => o.getAttribute('aria-selected') === 'true');
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    i = e.key === 'ArrowDown' ? Math.min(opts.length - 1, i + 1) : Math.max(0, i - 1);
    opts.forEach((o, j) => o.setAttribute('aria-selected', String(j === i)));
    input.setAttribute('aria-activedescendant', opts[i].id);
    opts[i].scrollIntoView({ block: 'nearest' });
  } else if (e.key === 'Enter') {
    e.preventDefault();
    pickCity(opts[Math.max(0, i)]);
  } else if (e.key === 'Escape') {
    e.stopPropagation();
    closeCombo(box);
  }
}, true);
document.addEventListener('click', (e) => {
  $$('[data-cityf]').forEach((box) => { if (!box.contains(e.target)) closeCombo(box); });
});

const BOOK_STEPS = ['Service', 'Détails', 'Date', 'Adresse', 'Confirmation'];
const SLOTS = ['07:00', '08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00'];

function dayKey(dt) {
  return `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
}
function slotTime(day, time) {
  const [y, m, dd] = day.split('-').map(Number);
  const [hh, mm] = time.split(':').map(Number);
  return new Date(y, m - 1, dd, hh, mm).getTime();
}
const slotOpen = (day, time) => slotTime(day, time) >= Date.now() + 75 * 60e3;
const slotUrgent = (day, time) => slotTime(day, time) < Date.now() + 24 * 3600e3;

      ${Object.entries(def.options).map(([k, o]) => {
        const on = b.options.includes(k);
        const with_ = P.quote(b.service, b.formula, Object.assign(detailsOf(b), { options: b.options.filter((x) => x !== k).concat(k) }), null, S.settings).price;
        const without = P.quote(b.service, b.formula, Object.assign(detailsOf(b), { options: b.options.filter((x) => x !== k) }), null, S.settings).price;
        return html`<label class="opt-row ${on ? 'is-on' : ''}">
          <input type="checkbox" ${on ? raw('checked') : ''} data-change="b-opt" value="${k}">
          <span class="opt-box">${icon('check')}</span><span class="opt-name">${o.label}</span>
          <span class="opt-price">+ ${fmtMoney(Math.max(0, with_ - without))}</span></label>`;
      })}
    </div>`;
}

function stepDate(b) {
  const days = [];
  const start = new Date();
  for (let i = 0; i < 21; i++) {
    const dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const key = dayKey(dt);
    if (SLOTS.some((t) => slotOpen(key, t))) days.push({ key, dt });
  }
  if (!b.day || !days.some((x) => x.key === b.day)) b.day = days[0].key;
  return html`<h2 class="step-title">Quel jour ?</h2>
    <div class="day-strip" role="radiogroup" aria-label="Jour">
      ${days.map(({ key, dt }) => html`<button type="button" role="radio" aria-checked="${String(key === b.day)}"
        class="day ${key === b.day ? 'is-on' : ''}" data-act="b-day" data-v="${key}">
        <small>${dt.toLocaleDateString('fr-CH', { weekday: 'short' })}</small><strong>${dt.getDate()}</strong>
        <small>${dt.toLocaleDateString('fr-CH', { month: 'short' })}</small></button>`)}
    </div>
    <h2 class="step-title">À quelle heure ?</h2>
    <div class="slot-grid" role="radiogroup" aria-label="Heure d’arrivée">
      ${SLOTS.map((t) => {
        const open = slotOpen(b.day, t);
        const urgent = open && slotUrgent(b.day, t);
        return html`<button type="button" role="radio" aria-checked="${String(t === b.time)}" class="slot ${t === b.time ? 'is-on' : ''}"
          data-act="b-time" data-v="${t}" ${open ? '' : raw('disabled')}>${t}${urgent ? html`<small>+${pct(S.settings.urgent_surcharge)}</small>` : ''}</button>`;
      })}
    </div>
    <p class="muted small">Heure d’arrivée du pro. Les créneaux dans les prochaines 24 h incluent un supplément urgence.</p>`;
}

function stepAddress(b) {
  return html`<h2 class="step-title">Adresse de la prestation</h2>
    <div class="form">
      <label class="field"><span>Rue et numéro</span><input data-input="b-field" name="address" value="${b.address}" autocomplete="street-address" required></label>
      <div class="grid-2 grid-npa">
        <label class="field"><span>NPA</span><input data-input="b-field" name="postal_code" value="${b.postal_code}" inputmode="numeric" autocomplete="postal-code" maxlength="10"></label>
        <label class="field"><span>Ville</span><input data-input="b-field" name="city" value="${b.city}" autocomplete="address-level2" required></label>
      </div>
      <div class="grid-2">
        <label class="field"><span>Contact sur place</span><input data-input="b-field" name="contact_name" value="${b.contact_name}" autocomplete="name"></label>
        <label class="field"><span>Téléphone</span><input data-input="b-field" name="contact_phone" type="tel" value="${b.contact_phone}" autocomplete="tel" inputmode="tel" required></label>
      </div>
      <label class="field"><span>Infos pour le pro <em>(facultatif)</em></span>
        <textarea data-input="b-field" name="notes" rows="3" maxlength="1000" placeholder="Code d’entrée, étage, clé chez le voisin, animaux…">${b.notes}</textarea></label>
      <p class="form-error" role="alert" id="b-error" hidden></p>
    </div>`;
}

function stepConfirm(b) {
  const q = bookingQuote(b, true);
  return html`<h2 class="step-title">Tout est juste ?</h2>
    <dl class="recap">
      <div><dt>Service</dt><dd>${P.SERVICES[b.service].formulas[b.formula].label}, ${P.SERVICES[b.service].label.toLowerCase()}</dd></div>
      <div><dt>Détails</dt><dd>${detailsLine({ service: b.service, details: detailsOf(b) })}</dd></div>
      ${b.service === 'car' ? html`<div><dt>Voiture</dt><dd>${b.car_model}</dd></div>` : ''}
      <div><dt>Date</dt><dd>${cap(fmtDayLong(scheduledIso(b)))} à ${fmtTime(scheduledIso(b))}</dd></div>
      <div><dt>Durée estimée</dt><dd>${fmtHours(q.hours)}</dd></div>
      <div><dt>Adresse</dt><dd>${b.address}, ${b.postal_code} ${b.city}</dd></div>
      <div><dt>Contact</dt><dd>${b.contact_name ? b.contact_name + ', ' : ''}${b.contact_phone}</dd></div>
      ${b.notes ? html`<div><dt>Infos</dt><dd>${b.notes}</dd></div>` : ''}
    </dl>
    <ul class="reassure">
      <li>${icon('wallet')}Rien à payer maintenant. Facture après la prestation.</li>
      <li>${icon('x')}Annulation gratuite tant que le pro n’est pas en route.</li>
    </ul>
    ${!S.session ? html`<p class="note">Vous allez créer un compte (30 secondes) pour confirmer. Votre réservation est gardée.</p>` : ''}`;
}

ACTIONS['b-step'] = (el) => { const b = ensureBooking(); b.step = Number(el.dataset.v); saveDraft(); refresh(); };
ACTIONS['b-back'] = () => { const b = ensureBooking(); b.step = Math.max(0, b.step - 1); saveDraft(); refresh().then(() => window.scrollTo(0, 0)); };
ACTIONS['b-service'] = (el) => { setService(ensureBooking(), el.dataset.v); saveDraft(); refresh(); };
ACTIONS['b-formula'] = (el) => { ensureBooking().formula = el.dataset.v; saveDraft(); refresh(); };
ACTIONS['b-size'] = (el) => { ensureBooking().size = el.dataset.v; saveDraft(); refresh(); };
ACTIONS['b-day'] = (el) => {
  const b = ensureBooking();
  b.day = el.dataset.v;
  if (b.time && !slotOpen(b.day, b.time)) b.time = null;
  saveDraft(); refresh();
};
ACTIONS['b-time'] = (el) => { ensureBooking().time = el.dataset.v; saveDraft(); refresh(); };
CHANGES['b-opt'] = (el) => {
  const b = ensureBooking();
  b.options = el.checked ? [...new Set(b.options.concat(el.value))] : b.options.filter((o) => o !== el.value);
  saveDraft(); refresh();
};
function setSurface(v, from) {
  const b = ensureBooking();
  const def = P.SERVICES[b.service];
  const n = Math.round(Number(v));
  if (!n) return;
  b.surface = Math.min(Math.max(n, def.min), def.max);
  if (from !== 'num') { const num = $('[data-input="b-surface-num"]'); if (num) num.value = b.surface; }
  if (from !== 'range') { const r = $('[data-input="b-surface-range"]'); if (r) r.value = b.surface; }
  $$('.opt-row').forEach((row) => {
    const k = row.querySelector('input').value;
    const w = P.quote(b.service, b.formula, Object.assign(detailsOf(b), { options: b.options.filter((x) => x !== k).concat(k) }), null, S.settings).price;
    const wo = P.quote(b.service, b.formula, Object.assign(detailsOf(b), { options: b.options.filter((x) => x !== k) }), null, S.settings).price;
    row.querySelector('.opt-price').textContent = `+ ${fmtMoney(Math.max(0, w - wo))}`;
  });
  saveDraft();
  repaintSummary();
}
INPUTS['b-surface-range'] = (el) => setSurface(el.value, 'range');
INPUTS['b-surface-num'] = (el) => setSurface(el.value, 'num');
INPUTS['b-field'] = (el) => {
  ensureBooking()[el.name] = el.value;
  saveDraft();
  if (el.name === 'address' || el.name === 'city' || el.name === 'postal_code' || el.name === 'car_model') repaintSummary();
};

function bookingError(b) {
  if (b.step === 1 && b.service === 'car' && !(b.car_model && b.car_model.trim().length >= 2)) return 'Indiquez le modèle de la voiture.';
  if (b.step === 2 && !(b.day && b.time)) return 'Choisissez une heure d’arrivée.';
  if (b.step === 2 && !slotOpen(b.day, b.time)) return 'Ce créneau n’est plus disponible, choisissez-en un autre.';
  if (b.step === 3) {
    if (!b.address || b.address.trim().length < 3) return 'Indiquez la rue et le numéro.';
    if (!b.city || b.city.trim().length < 2) return 'Indiquez la ville.';
    if (!b.contact_phone || b.contact_phone.replace(/\D/g, '').length < 8) return 'Indiquez un téléphone joignable le jour J.';
  }
  return null;
}
ACTIONS['b-next'] = () => {
  const b = ensureBooking();
  const err = bookingError(b);
  if (err) {
    const box = $('#b-error');
    if (box) { box.textContent = err; box.hidden = false; }
    toast(err, 'bad');
    return;
  }
  b.step = Math.min(4, b.step + 1);
  saveDraft();
  refresh().then(() => window.scrollTo(0, 0));
};
// Le modèle de voiture part dans les infos pour le pro
function bookingNotes(b) {
  const model = b.service === 'car' && b.car_model ? `Voiture : ${b.car_model.trim()}` : '';
  return [model, (b.notes || '').trim()].filter(Boolean).join('\n').slice(0, 1000);
}
ACTIONS['b-confirm'] = async (btn) => {
  const b = ensureBooking();
  if (!S.session) { S.afterLogin = '#reserver'; saveDraft(); go('inscription'); return; }
  if (!slotOpen(b.day, b.time)) { b.step = 2; toast('Ce créneau vient de passer, choisissez-en un autre.', 'bad'); refresh(); return; }
  const m = await run(btn, () => S.api.createMission({
    service: b.service, formula: b.formula, details: detailsOf(b), scheduled_at: scheduledIso(b),
    address: b.address.trim(), postal_code: b.postal_code.trim(), city: b.city.trim(),
    contact_name: b.contact_name.trim(), contact_phone: b.contact_phone.trim(), notes: bookingNotes(b),
  }));
  S.booking = null;
  clearDraft();
  toast('Réservation envoyée aux pros de votre région', 'ok');
  go('m-' + m.id);
};

/* ============================================================ missions : listes & détail */

    <span class="mrow-date"><small>${dt.toLocaleDateString('fr-CH', { weekday: 'short' })}</small><strong>${dt.getDate()}</strong>
      <small>${dt.toLocaleDateString('fr-CH', { month: 'short' })}</small></span>

      <strong>${formulaLabel(m)}</strong>

      <small class="mrow-meta">${icon('clock')}${fmtTime(m.scheduled_at)}${icon('pin')}${m.city}${o.who ? html`${icon('user')}${o.who}` : ''}</small>
    </span>
    <span class="mrow-side">

const ACTIVE = ['pending', 'accepted', 'on_the_way', 'in_progress'];

// ---------------------------------------------------------------- réservations du client
VIEWS['client-list'] = {
  title: () => 'Mes réservations',

        <a class="btn btn-primary" href="#reserver">${icon('plus')}Réserver</a>
      </div>
      ${!list.length ? html`<div class="empty">
          ${icon('calendar', 'ic-xl')}
          <h2>Votre premier ménage en une minute</h2>
          <p>Choisissez le service, voyez le prix tout de suite, un pro vérifié s’en occupe.</p>
          <a class="btn btn-primary btn-lg" href="#reserver">Réserver un nettoyage</a></div>` : ''}

// ---------------------------------------------------------------- détail d'une mission
VIEWS.mission = {
  title: () => (S.view.m ? `${formulaLabel(S.view.m)} ${S.view.m.ref}` : 'Mission'),
  live: true,
  async load(r) {

      role() === 'admin' ? S.api.listProfiles() : Promise.resolve([]),

    return { m, people, messages, providers, sig: JSON.stringify(m) };
  },
  render() {

    const isPro = m.provider_id === me;

            <span class="svc-ic svc-ic-lg">${icon(SERVICE_ICON[m.service])}</span>
            <div class="mhead-title"><h1>${formulaLabel(m)}</h1><p>${serviceLabel(m)}${detailsLine(m) ? `, ${detailsLine(m)}` : ''}</p></div>
            ${statusPill(m.status, true)}
          </div>
          ${timeline(m)}
        </div>
        <div class="ticket-perf" aria-hidden="true"></div>
        <div class="ticket-stub mhead-stub">
          ${isPro && !isAdmin ? html`<span class="stub-label">Vous touchez</span><strong class="price">${fmtMoney(earnings(m), m.currency)}</strong>

            : html`<span class="stub-label">Prix fixe</span><strong class="price">${fmtMoney(m.price, m.currency)}</strong>
              <span class="stub-sub">${m.payment_status === 'paid' ? 'Payée, merci' : m.status === 'cancelled' ? 'Rien à payer' : 'Facture après la prestation'}</span>`}
          <span class="mref">Réf. ${m.ref}</span>

      </div>
      ${m.status === 'cancelled' ? html`<div class="banner banner-off">${icon('x')}<div><strong>Mission annulée${m.cancelled_at ? ` le ${fmtDay(m.cancelled_at)}` : ''}</strong>
        ${m.cancel_reason ? html`<p>Motif : ${m.cancel_reason}</p>` : ''}</div></div>` : ''}
      <div class="mgrid">
        <section class="panel">
          <h2 class="panel-title">Informations</h2>
          <dl class="info">
            <div>${icon('calendar')}<dt>Date</dt><dd>${cap(fmtDayLong(m.scheduled_at))} à ${fmtTime(m.scheduled_at)}</dd></div>

            <div>${icon('pin')}<dt>Adresse</dt><dd>${m.address}<br>${m.postal_code} ${m.city}

function timeline(m) {
  const at = { pending: m.created_at, accepted: m.accepted_at, on_the_way: null, in_progress: m.started_at, done: m.completed_at };
  const labels = { pending: 'Demande envoyée', accepted: 'Pro confirmé', on_the_way: 'En route', in_progress: 'Commencée', done: 'Terminée' };
  const idx = m.status === 'cancelled' ? -1 : FLOW.indexOf(m.status);
  return html`<ol class="timeline ${m.status === 'cancelled' ? 'is-off' : ''}" aria-label="Avancement">
    ${FLOW.map((s, i) => html`<li class="${i < idx ? 'is-done' : i === idx ? 'is-on' : ''}">
      <span class="tl-dot">${i <= idx ? icon('check') : ''}</span>
      <span class="tl-txt"><strong>${labels[s]}</strong>${at[s] && i <= idx ? html`<small>${fmtStamp(at[s])}</small>` : ''}</span></li>`)}
  </ol>`;
}

function personCard(p, label, fallback) {
  if (!p) return html`<div class="person person-empty">${icon('user')}<p>${fallback}</p></div>`;
  return html`<div class="person">
    <span class="avatar avatar-lg">${initials(p.full_name)}</span>
    <div class="person-txt"><small>${label}</small><strong>${p.full_name}</strong>
      ${p.phone ? html`<a class="person-phone" href="${telHref(p.phone)}">${p.phone}</a>` : ''}
      ${p.role === 'provider' ? (Number(p.rating_count) ? html`<span class="person-rating">${stars(p.rating_avg)}
        <span>${Number(p.rating_avg).toFixed(1).replace('.', ',')} (${p.rating_count} avis)</span></span>` : html`<small>Nouveau sur Proova</small>`) : ''}
    </div>
    ${p.phone ? html`<a class="icon-btn icon-btn-solid" href="${telHref(p.phone)}" aria-label="Appeler ${p.full_name}">${icon('phone')}</a>` : ''}
  </div>`;
}

function clientMissionPanel(m, pro) {
  const canCancel = ['pending', 'accepted'].includes(m.status);
  const msg = {
    pending: 'Votre demande est visible par les pros validés de votre région. Vous serez prévenu ici dès qu’un pro l’accepte.',
    accepted: 'Votre pro est réservé. Il vous écrit ici s’il a besoin d’une précision.',
    on_the_way: 'Votre pro est en route.',
    in_progress: 'La mission est en cours.',
    done: 'Mission terminée. Vous recevez la facture par email.',
    cancelled: '',
  }[m.status];
  return html`<h2 class="panel-title">Votre pro</h2>
    ${personCard(pro, 'Prestataire', 'Nous cherchons un pro disponible pour ce créneau.')}
    ${msg ? html`<p class="muted">${msg}</p>` : ''}
    ${canCancel ? html`<div class="actions"><button class="btn btn-ghost btn-danger" data-act="m-cancel">Annuler la réservation</button></div>` : ''}`;
}

function proSteps(m) {
  const b = [];
  if (m.status === 'accepted') {
    b.push(html`<button class="btn btn-primary btn-block" data-act="m-advance" data-v="on_the_way">${icon('route')}Je suis en route</button>`);
    b.push(html`<button class="btn btn-block" data-act="m-advance" data-v="in_progress">${icon('play')}Commencer sur place</button>`);
  } else if (m.status === 'on_the_way') {
    b.push(html`<button class="btn btn-primary btn-block" data-act="m-advance" data-v="in_progress">${icon('play')}Je suis arrivé, je commence</button>`);
  } else if (m.status === 'in_progress') {
    b.push(html`<button class="btn btn-primary btn-block" data-act="m-advance" data-v="done">${icon('flag')}Mission terminée</button>`);
  }
  return b;
}

function proMissionPanel(m, client) {
  return html`<h2 class="panel-title">Client</h2>

async function pollMission() {
  const v = V();
  if (!v.m) return;
  try {
    const [m, messages] = await Promise.all([S.api.getMission(v.m.id), S.api.listMessages(v.m.id)]);
    if (S.route.name !== 'mission' || !m || V() !== v) return;
    if (JSON.stringify(m) !== v.sig) { refresh(); return; }
    if (messages.length !== v.messages.length) {
      v.messages = messages;
      const t = $('#thread');
      if (t) { t.innerHTML = str(chatThread()); t.scrollTop = t.scrollHeight; }
    }
  } catch (e) { /* réseau : on réessaiera au prochain tour */ }
}

// ---------------------------------------------------------------- graphique en barres (une série)
function barChart(points, o) {
  const max = Math.max(1, ...points.map((p) => p.value));
  const rough = max / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  let step = [1, 2, 2.5, 5, 10].map((k) => k * mag).find((x) => x >= rough) || rough;
  if (!o.money) step = Math.max(1, Math.ceil(step));
  const top = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = 0; v <= top + 1e-9; v += step) ticks.push(v);
  const fmt = (v) => (o.money ? fmtMoney(v) : String(v));
  const total = points.reduce((a, p) => a + p.value, 0);
  const every_ = points.length > 10 ? 2 : 1;
  if (!total) {
    return html`<div class="chart"><div class="chart-head"><h2 class="panel-title">${o.title}</h2></div>
      <p class="muted chart-empty">Rien sur la période pour l\u2019instant. Les barres apparaîtront avec les premières missions.</p></div>`;
  }
  return html`<div class="chart">
    <div class="chart-head"><h2 class="panel-title">${o.title}</h2><span class="muted">${o.money ? fmtMoney(total) : total} sur la période</span></div>
    <div class="plot" aria-hidden="true">
      <div class="plot-grid">${ticks.map((v) => html`<div class="plot-line" style="bottom:${(v / top) * 100}%"><span>${Math.round(v)}</span></div>`)}</div>
      <div class="plot-cols" style="--n:${points.length}">${points.map((p, i) => html`<div class="bcol" tabindex="0" data-tip="${p.label} : ${fmt(p.value)}">
        <div class="bslot"><div class="bar ${p.current ? 'bar-now' : ''}" style="height:${(p.value / top) * 100}%"></div></div>
        <span class="blabel ${p.current ? 'blabel-now' : ''}">${(points.length - 1 - i) % every_ === 0 ? (p.short || p.label) : ''}</span></div>`)}</div>
    </div>
    <div class="chart-tip" role="status" hidden></div>
    <table class="sr-only"><caption>${o.title}</caption><tbody>${points.map((p) => html`<tr><th>${p.label}</th><td>${fmt(p.value)}</td></tr>`)}</tbody></table>
  </div>`;
}
function chartTip(e) {
  const g = e.target.closest && e.target.closest('.bcol');
  const chart = e.target.closest && e.target.closest('.chart');
  if (!chart) return;
  const tip = chart.querySelector('.chart-tip');
  if (!tip) return;
  if (!g) { tip.hidden = true; return; }
  const box = chart.getBoundingClientRect();
  const r = g.getBoundingClientRect();
  tip.textContent = g.dataset.tip;
  tip.hidden = false;
  tip.style.left = `${Math.min(Math.max(r.left - box.left + r.width / 2, 60), box.width - 60)}px`;
  const bar = g.querySelector('.bar');
  const br = bar.getBoundingClientRect();
  tip.style.top = `${Math.max(0, (br.height ? br.top : r.top + r.height - 30) - box.top - 6)}px`;
}
// Souris : au survol. Doigt : au toucher, et l'infobulle disparaît dès qu'on fait défiler.
document.addEventListener('pointerover', (e) => { if (e.pointerType === 'mouse') chartTip(e); });
document.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'mouse') chartTip(e); });
document.addEventListener('focusin', chartTip);
window.addEventListener('scroll', () => $$('.chart-tip').forEach((t) => { t.hidden = true; }), { passive: true });
document.addEventListener('pointerleave', (e) => {
  const tip = e.target.classList && e.target.classList.contains('chart') && e.target.querySelector('.chart-tip');
  if (tip) tip.hidden = true;
}, true);

async function syncSession() {
  S.session = S.api.getSession();
  S.profile = null;
  if (!S.session) return;
  try {
    S.profile = await S.api.getProfile();
  } catch (e) {
    S.profile = null;
  }
  if (!S.profile) {
    // Profil pas encore créé côté serveur (rare) : profil minimal pour ne pas bloquer l'interface
    S.profile = { id: S.session.user.id, email: S.session.user.email, role: 'client', full_name: '', phone: '', city: '', services: [] };
  }
  if (S.pendingServices && S.profile.role === 'provider' && !(S.profile.services || []).length) {
    try { S.profile = await S.api.becomeProvider(S.pendingServices, '', S.profile.city); } catch (e) { /* le profil reste modifiable */ }
  }
  S.pendingServices = null;
}

  const hashError = /error_description=([^&]+)/.exec(location.hash);
  const live = !!(CFG.supabaseUrl && CFG.supabaseAnonKey);
  S.api = live ? new window.SupabaseBackend(CFG) : new window.LocalBackend();
  try {
    await S.api.init();
  } catch (e) {
    root.innerHTML = str(html`<div class="splash splash-error">${logo('logo-lg')}
      <h1>Connexion au serveur impossible</h1><p>Vérifiez votre connexion internet, puis réessayez.</p>
      <button class="btn btn-primary" onclick="location.reload()">Réessayer</button></div>`);
    return;
  }
  try { S.settings = Object.assign({}, P.DEFAULT_SETTINGS, await S.api.getSettings()); } catch (e) { /* tarifs par défaut */ }
  await syncSession();

  S.api.onAuthChange(async (event) => {
    await syncSession();
    if (event === 'PASSWORD_RECOVERY') { go('nouveau-mdp', true); return; }
    if (!S.session) { go('accueil', true); return; }
    const draft = loadDraft();
    const target = S.afterLogin || (role() === 'client' && draft && draft.step >= 4 ? 'reserver' : null);
    S.afterLogin = null;
    go(target || homeFor(), true);
  });
  S.api.onDataChange(() => {
    const v = VIEWS[S.route.name];
    if (v && v.live && !$('.sheet-wrap')) refresh();
  });
  window.addEventListener('hashchange', navigate);
  document.addEventListener('visibilitychange', () => {
    const v = VIEWS[S.route.name];
    if (!document.hidden && v && v.live && S.session && !$('.sheet-wrap')) refresh();
  });
  await navigate();
  if (hashError) toast(decodeURIComponent(hashError[1].replace(/\+/g, ' ')), 'bad');
}

boot();

})();

</script>
</body>
</html>
